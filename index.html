<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maths Quest">
<meta name="color-scheme" content="light dark">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Maths Quest Seconde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: cahier à petits carreaux ; une colonne d'écrans (accueil → monde → partie → résultat), clavier maths fixé en bas pendant une partie */
:root{
  --paper:#F2F5FA; --grid:rgba(52,92,170,.10); --ink:#16213A; --muted:#5B6787; --card:#FFFFFF; --line:#D3DCEB;
  --key:#FFFFFF; --key-alt:#E3EAF5; --key-fg:#16213A; --shadow:0 1px 0 rgba(22,33,58,.18);
  --gold:#F0B000; --gold-dim:#D7DEEA; --good:#16946A; --good-bg:#E2F5EC; --bad:#D13F38; --bad-bg:#FCE7E5;
  --w1:#0C9A95; --w2:#D98200; --w3:#DF4B45; --w4:#7356DA;
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --f-body:"Atkinson Hyperlegible",-apple-system,"Segoe UI",sans-serif;
  --f-math:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101727; --grid:rgba(130,165,235,.07); --ink:#E7ECF6; --muted:#98A4C2; --card:#1A2338; --line:#2B3651;
  --key:#232D46; --key-alt:#2F3B58; --key-fg:#E7ECF6; --shadow:0 1px 0 rgba(0,0,0,.5);
  --gold:#FFC531; --gold-dim:#36415C; --good:#3CC48F; --good-bg:#15372B; --bad:#FF6B63; --bad-bg:#3E1E21;
  --w1:#27C2BC; --w2:#F59F1F; --w3:#FF6A63; --w4:#9479F5; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101727; --grid:rgba(130,165,235,.07); --ink:#E7ECF6; --muted:#98A4C2; --card:#1A2338; --line:#2B3651;
  --key:#232D46; --key-alt:#2F3B58; --key-fg:#E7ECF6; --shadow:0 1px 0 rgba(0,0,0,.5);
  --gold:#FFC531; --gold-dim:#36415C; --good:#3CC48F; --good-bg:#15372B; --bad:#FF6B63; --bad-bg:#3E1E21;
  --w1:#27C2BC; --w2:#F59F1F; --w3:#FF6A63; --w4:#9479F5; color-scheme:dark}
html,body{height:100%}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
#app{height:100%;max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--w4);outline-offset:2px}
.screen{min-height:100%;display:flex;flex-direction:column;gap:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 28px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
.eyebrow{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.m{font-family:var(--f-math);font-weight:500;white-space:nowrap}
sup{font-size:.68em;line-height:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-family:var(--f-math);font-size:.92em;margin:0 2px}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}

/* accueil */
.hero{display:flex;flex-direction:column;gap:6px;padding-top:8px}
.hero h1{font-size:44px;color:var(--ink)}
.hero h1 span{color:var(--w3)}
.sub{margin:0;color:var(--muted)}
.totstars{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;margin-top:6px;padding:6px 12px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-variant-numeric:tabular-nums;color:var(--muted)}
.totstars b{color:var(--ink);font-size:18px}
.worlds{display:flex;flex-direction:column;gap:12px}
.wcard{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 3px 0 var(--line);transition:transform .12s}
.wcard:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.glyph{width:64px;height:64px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-math);font-weight:700;font-size:28px;color:#fff;background:var(--wc)}
.wcard .meta{min-width:0;display:flex;flex-direction:column;gap:4px}
.wcard h2{font-size:21px}
.wcard .chap{font-size:13px;color:var(--muted)}
.segs{display:flex;gap:4px;margin-top:2px}
.segs i{flex:1;height:7px;border-radius:4px;background:var(--gold-dim)}
.segs i.on{background:var(--wc)}
.segs i.boss{flex:1.4}
.wcard .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:12px;font-weight:700;font-size:17px;background:var(--ink);color:var(--paper);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.world{background:var(--wc);color:#fff}
.foot{margin:0;font-size:13px;color:var(--muted);text-align:center}

/* carte d'un monde */
.top{display:flex;align-items:center;gap:10px}
.back{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1.5px solid var(--line);font-size:20px;flex:none}
.wbanner{background:var(--wc);color:#fff;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:4px}
.wbanner .eyebrow{color:rgba(255,255,255,.85)}
.wbanner h2{font-size:30px}
.trail{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:4px}
.trail::before{content:"";position:absolute;left:31px;top:30px;bottom:40px;border-left:3px dashed var(--line)}
.lvl{position:relative;display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;text-align:left;padding:4px 0}
.node{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:24px;background:var(--card);border:3px solid var(--wc);color:var(--wc);box-shadow:0 3px 0 var(--line)}
.lvl.done .node{background:var(--wc);color:#fff}
.lvl.locked .node{border-color:var(--line);color:var(--muted);background:var(--paper)}
.lvl.boss .node{width:64px;height:64px;margin-left:-4px;border-radius:16px;transform:rotate(45deg)}
.lvl.boss .node>*{transform:rotate(-45deg)}
.lvl .info{display:flex;flex-direction:column;gap:3px;min-width:0}
.lvl h3{font-size:19px}
.lvl.locked h3{color:var(--muted)}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--key-alt);color:var(--muted)}
.tag.hard{background:var(--bad-bg);color:var(--bad)}
.tag.boss{background:var(--ink);color:var(--paper)}
.stars{display:inline-flex;gap:2px}
.stars svg{width:16px;height:16px}

/* partie */
.play{height:100%;display:flex;flex-direction:column}
.phead{display:flex;align-items:center;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 8px}
.phead .ttl{flex:1;min-width:0}
.phead .ttl b{display:block;font-family:var(--f-display);font-weight:400;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:4px;margin-top:4px}
.dots i{width:100%;max-width:22px;height:6px;border-radius:3px;background:var(--gold-dim)}
.dots i.cur{background:var(--wc)}
.dots i.ok{background:var(--good)}
.dots i.ko{background:var(--bad)}
.dots i.done{background:var(--muted)}
.hearts{display:flex;gap:2px}
.hearts svg{width:24px;height:24px}
.hearts .lost{opacity:.22}
.qzone{flex:1;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px 10px;display:flex;flex-direction:column;gap:12px}
.qcard{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.qnum{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--wc)}
.qtext{font-size:18px;line-height:1.55;overflow-wrap:anywhere}
.qtext .m{white-space:normal}
.ansbox{background:var(--card);border:2px solid var(--wc);border-radius:12px;min-height:56px;padding:10px 14px;font-family:var(--f-math);font-size:22px;display:flex;align-items:center;flex-wrap:wrap;overflow-wrap:anywhere}
.ansbox .ph{color:var(--muted);font-family:var(--f-body);font-size:15px}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--wc);margin:0 1px;vertical-align:middle;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hint{font-size:13px;color:var(--muted);margin:-4px 2px 0}
.warn{font-size:14px;color:var(--bad);font-weight:700;margin:0 2px}
.kbwrap{background:var(--key-alt);border-top:1.5px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:8px calc(8px + env(safe-area-inset-bottom,0px))}
.kb{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:520px;margin:0 auto}
.key{min-height:44px;border-radius:9px;background:var(--key);color:var(--key-fg);font-family:var(--f-math);font-size:19px;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none}
.key:active{transform:translateY(1px);filter:brightness(.92)}
.key.alt{background:var(--key-alt);border:1.5px solid var(--line);font-size:17px}
.key.go{grid-column:span 3;background:var(--wc);color:#fff;font-family:var(--f-body);font-weight:700;font-size:17px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;max-width:520px;margin:0 auto}
.choice{min-height:56px;border-radius:12px;background:var(--key);box-shadow:var(--shadow);font-size:22px;font-family:var(--f-math);font-weight:700}
.choice.word{font-family:var(--f-body);font-size:18px}
.choice.sel{background:var(--wc);color:#fff}
.choices .key.go{grid-column:1/-1;min-height:52px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;z-index:30;animation:pop 1.3s forwards;white-space:nowrap}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-8px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* correction */
.fb{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;border:1.5px solid}
.fb.ok{background:var(--good-bg);border-color:var(--good)}
.fb.ko{background:var(--bad-bg);border-color:var(--bad)}
.fb h3{font-size:22px}
.fb.ok h3{color:var(--good)}
.fb.ko h3{color:var(--bad)}
.errname{margin:0;font-weight:700;color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline;font-size:15px}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;font-family:var(--f-math);font-size:17px;overflow-wrap:anywhere}
.sol{font-size:15px;line-height:1.6;border-top:1px dashed var(--line);padding-top:8px;overflow-wrap:anywhere}
.fb .sol{border-color:currentColor;border-top-color:rgba(127,127,127,.35)}
.nextbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(12px + env(safe-area-inset-bottom,0px));background:var(--key-alt);border-top:1.5px solid var(--line)}
.nextbar .btn{width:100%}

/* résultat */
.res{align-items:stretch}
.bigstars{display:flex;justify-content:center;gap:10px;padding-top:10px}
.bigstars svg{width:58px;height:58px}
.bigstars svg:nth-child(2){transform:translateY(-12px)}
.res h2{font-size:34px;text-align:center}
.score{text-align:center;font-family:var(--f-math);font-size:20px;color:var(--muted);margin:0}
.verdict{text-align:center;margin:0}
.actions{display:flex;flex-direction:column;gap:10px}
.review{display:flex;flex-direction:column;gap:8px}
.review h3{font-size:20px;margin-top:6px}
details.it{background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--line);border-radius:12px;padding:10px 12px}
details.it.ok{border-left-color:var(--good)}
details.it.ko{border-left-color:var(--bad)}
details.it.na{border-left-color:var(--muted)}
details.it summary{cursor:pointer;display:flex;gap:8px;align-items:baseline;list-style:none}
details.it summary::-webkit-details-marker{display:none}
details.it summary .n{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
details.it summary .s{flex:1;min-width:0;font-size:15px}
details.it[open] summary{margin-bottom:8px}
details.it .qtext{font-size:16px}

/* bilan */
.bilan pre{white-space:pre-wrap;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px;font-family:var(--f-math);font-size:13px;line-height:1.55;margin:0;user-select:text;-webkit-user-select:text;overflow-wrap:anywhere}
.copied{color:var(--good);font-weight:700;text-align:center;margin:0}
.small{font-size:14px;color:var(--muted);margin:0}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   OUTILS MATHS
   ===================================================================== */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const RN=(a,b)=>{let v;do v=R(a,b);while(v===0);return v};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a};
const lcm=(a,b)=>a/gcd(a,b)*b;
const isPrime=n=>{if(n<2)return false;for(let p=2;p*p<=n;p++)if(n%p===0)return false;return true};
const primesUpTo=k=>{const r=[];for(let p=2;p<=k;p++)if(isPrime(p))r.push(p);return r};
const factor=n=>{const f=[];let p=2;while(n>1){let e=0;while(n%p===0){n/=p;e++}if(e)f.push([p,e]);p++}return f};
const decStr=n=>factor(n).map(([p,e])=>e>1?`${p}^${e}`:`${p}`).join('*');
const fr=(n,d)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;n/=g;d/=g;return d===1?`${n}`:`${n}/${d}`};
const m=n=>n<0?'−'+(-n):String(n);
const fmtD=v=>String(+v.toFixed(6)).replace('.',',').replace('-','−');
function poly(cs){const deg=cs.length-1;let s='';cs.forEach((c,i)=>{const p=deg-i;if(c===0)return;const sign=c<0?'-':(s?'+':'');const a=Math.abs(c);const coef=(a===1&&p>0)?'':String(a);const v=p===0?'':(p===1?'x':'x^'+p);s+=sign+coef+v});return s||'0'}
/* Mise en forme jolie d'une écriture « plate » (x^2, -, *) */
function P(s){s=String(s);s=s.replace(/([0-9xπ)²³√])([+\-])/g,'$1 $2 ');s=s.replace(/\^\(([^)]*)\)/g,'<sup>$1</sup>').replace(/\^(-?[0-9x]+)/g,'<sup>$1</sup>');return s.replace(/\*/g,' × ').replace(/-/g,'−').replace(/;/g,' ; ')}
function F(n,d){if(typeof n==='string'||typeof d==='string')return `<span class="fr"><span>${n}</span><span>${d}</span></span>`;const neg=(n<0)!==(d<0);return `${neg?'−':''}<span class="fr"><span>${Math.abs(n)}</span><span>${Math.abs(d)}</span></span>`}
function PF(s){const k=String(s).match(/^(-?)(\d+)\/(\d+)$/);return k?F((k[1]?-1:1)*k[2],+k[3]):P(s)}
const mx=s=>`<span class="m">${P(s)}</span>`;

/* ----- lecteur d'expressions ----- */
function norm0(s){return String(s).replace(/\s+/g,'').replace(/[−–]/g,'-').replace(/[×·]/g,'*').replace(/÷/g,'/').replace(/X/g,'x')}
function parseExpr(src){
  const s=norm0(src).replace(/,/g,'.');const t=[];let i=0;
  while(i<s.length){const c=s[i];
    if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;const str=s.slice(i,j);if((str.match(/\./g)||[]).length>1||str==='.')throw 0;t.push({k:'n',v:parseFloat(str)});i=j;continue}
    if(c==='x'){t.push({k:'x'});i++;continue}
    if(c==='π'){t.push({k:'n',v:Math.PI});i++;continue}
    if(c==='∞'){t.push({k:'n',v:Infinity});i++;continue}
    if('+-*/^()√²³'.includes(c)){t.push({k:c});i++;continue}
    throw 0}
  let p=0;const peek=()=>t[p];const eat=k=>{if(t[p]&&t[p].k===k){p++;return true}return false};
  const starts=tk=>tk&&(tk.k==='n'||tk.k==='x'||tk.k==='('||tk.k==='√');
  function expr(){let f=term();while(peek()&&(peek().k==='+'||peek().k==='-')){const op=t[p++].k;const g=term(),a=f;f=op==='+'?x=>a(x)+g(x):x=>a(x)-g(x)}return f}
  function term(){let f=unary();for(;;){const tk=peek();if(tk&&(tk.k==='*'||tk.k==='/')){p++;const g=unary(),a=f;f=tk.k==='*'?x=>a(x)*g(x):x=>a(x)/g(x)}else if(starts(tk)){const g=power(),a=f;f=x=>a(x)*g(x)}else break}return f}
  function unary(){if(eat('-')){const g=unary();return x=>-g(x)}if(eat('+'))return unary();return power()}
  function power(){const b=post();if(eat('^')){const e=unary();return x=>Math.pow(b(x),e(x))}return b}
  function post(){let f=prim();for(;;){if(eat('²')){const a=f;f=x=>a(x)**2}else if(eat('³')){const a=f;f=x=>a(x)**3}else break}return f}
  function prim(){const tk=t[p++];if(!tk)throw 0;if(tk.k==='n'){const v=tk.v;return()=>v}if(tk.k==='x')return x=>x;
    if(tk.k==='('){const f=expr();if(!eat(')'))throw 0;return f}
    if(tk.k==='√'){const g=prim();return x=>Math.sqrt(g(x))}throw 0}
  if(!t.length)throw 0;const f=expr();if(p<t.length)throw 0;return f}
const eqNum=(a,b)=>{if(a===b)return true;if(Number.isNaN(a)&&Number.isNaN(b))return true;if(!isFinite(a)||!isFinite(b))return false;if(a===0||b===0)return Math.abs(a-b)<1e-12;return Math.abs(a-b)<=1e-9*Math.max(Math.abs(a),Math.abs(b))};
const XS=[0.37,1.91,-1.3,2.73,-0.58,3.17];
const eqExpr=(u,e)=>{const fu=parseExpr(u),fe=parseExpr(e);return XS.every(x=>eqNum(fu(x),fe(x)))};
const valN=s=>{if(/x/i.test(s))throw 0;return parseExpr(s)(0)};
function parseSet(src){
  const s=String(src).replace(/\s+/g,'').replace(/[−–]/g,'-').replace(/[Uu]/g,'∪');
  if(s==='∅'||s==='{}'||s==='{∅}')return [];
  const out=[];
  for(const part of s.split('∪')){
    if(part==='ℝ'||part==='R'){out.push({lo:-Infinity,hi:Infinity,lc:false,hc:false});continue}
    let k=part.match(/^\{(.*)\}$/);
    if(k){for(const e of k[1].split(';'))if(e!=='')out.push({pt:valN(e)});continue}
    k=part.match(/^([\[\]])([^;]+);([^;]+)([\[\]])$/);

function check(q,raw){
  raw=String(raw||'').trim();
  if(!raw)return{invalid:q.t==='choice'?'Choisis une réponse.':'Écris une réponse avant de valider.'};
  if(q.t==='choice'){let n=nrm(raw);return{ok:q.a.some(a=>nrm(a)===n)}}
  if(q.t==='dec')return checkDec(raw,q.n);
  let ok;
  try{ok=EQ[q.t](raw,q.a)}catch(e){
    return{invalid:q.t==='set'?'Écriture non reconnue. Exemples : [2 ; 5[ , {−1 ; 4} , ∅. Sépare avec « ; ».':q.t==='list'?'Écriture non reconnue : sépare les nombres par « ; ».':'Écriture non reconnue : vérifie les parenthèses et les signes.'}}
  if(ok){
    if(q.t==='expr'&&q.form==='dev'&&/\(/.test(raw))return{ok:false,msg:"Le résultat est juste, mais il n'est pas développé : il reste des parenthèses.",tag:'Forme attendue'};
    if(q.t==='expr'&&q.form==='fact'&&(!/\(/.test(raw)||topLevelSum(raw)))return{ok:false,msg:"Le résultat est juste, mais il n'est pas factorisé : on attend un produit.",tag:'Forme attendue'};
    if(q.t==='frac'){const s=norm0(raw).replace(/[()]/g,'');const k=s.match(/^(-?)(\d+)(?:\/(-?)(\d+))?$/);
      if(!k)return{ok:false,msg:'Le résultat est juste, mais donne-le sous forme de fraction irréductible.',tag:'Fractions'};
      if(k[4]&&(gcd(+k[2],+k[4])!==1||+k[4]===1))return{ok:false,msg:"La fraction est juste mais pas irréductible : simplifie encore.",tag:'Fractions'}}
    if(q.t==='rad'){const s=norm0(raw);const k=s.match(/^(\d*)\*?√(\d+)$/);
      if(k){const n=+k[2];for(let d=2;d*d<=n;d++)if(n%(d*d)===0)return{ok:false,msg:`On peut encore simplifier : ${d*d} divise ${n}.`,tag:'Racines carrées'}}
      else if(!/^\d+$/.test(s))return{ok:false,msg:'Écris le résultat sous la forme a√b.',tag:'Racines carrées'}}
    return{ok:true}}
  if(q.t==='set'){try{if(parseSet(raw).some(I=>!('pt'in I)&&((I.lo===-Infinity&&I.lc)||(I.hi===Infinity&&I.hc))))return{ok:false,msg:"Du côté de l'infini, le crochet est toujours ouvert.",tag:'Intervalles'}}catch(e){}}
  for(const tr of(q.traps||[])){try{if(EQ[q.t](raw,tr.a))return{ok:false,msg:tr.msg,tag:tr.tag}}catch(e){}}
  return{ok:false}}
function checkDec(raw,n){
  const parts=norm0(raw).split('*');let prod=1;const bad=[];

    if(!k)return{invalid:'Écris un produit, par exemple 2^2 × 3 × 7.'};

  if(bad.length)return{ok:false,msg:`${bad[0]} n'est pas un nombre premier : il faut continuer à décomposer.`,tag:'Décomposition en facteurs premiers'};
  return{ok:true}}

 mult(){const b=R(6,15),k=R(4,20),a=b*k+pick([0,0,1,b-1,2]);const y=a%b===0;return{q:`<b class="m">${a}</b> est-il un multiple de <b class="m">${b}</b> ?`,t:'choice',a:[y?'Oui':'Non'],keys:['Oui','Non'],sol:y?`${a} = ${b} × ${a/b}.`:`${a} = ${b} × ${Math.floor(a/b)} + ${a%b} : le reste n'est pas nul.`,skill:'Multiples et diviseurs'}},
 primeSmall(){const n=Math.random()<.5?pick(P_SMALL):pick(C_SMALL);return{q:`<b class="m">${n}</b> est-il un nombre premier ?`,t:'choice',a:[isPrime(n)?'Oui':'Non'],keys:['Oui','Non'],sol:primeSol(n),skill:'Nombres premiers'}},
 prime3(){const n=Math.random()<.5?pick(P_BIG):pick(C_BIG);return{q:`Sans calculatrice : <b class="m">${n}</b> est-il un nombre premier ?`,t:'choice',a:[isPrime(n)?'Oui':'Non'],keys:['Oui','Non'],sol:primeSol(n)+'<br>On ne teste que les nombres <b>premiers</b>, pas tous les entiers.',skill:'Nombres premiers'}},
 smallDiv(){const n=pick(C_BIG);const p=factor(n)[0][0];return{q:`Quel est le plus petit diviseur premier de <b class="m">${n}</b> ?`,t:'num',a:String(p),sol:`On teste 2, 3, 5, 7, 11, 13… dans l'ordre : ${n} = ${p} × ${n/p}.`,skill:'Nombres premiers'}},
 dec(k){const big=k==='boss';let n;do{n=2**R(0,big?4:3)*3**R(0,big?3:2)*5**R(0,big?2:1)*7**R(0,1);if(big&&Math.random()<.35)n*=pick([11,13])}while(n<(big?300:12)||n>(big?3000:400)||isPrime(n));
  return{q:`Décompose <b class="m">${n}</b> en produit de facteurs premiers.`,t:'dec',n,a:decStr(n),hint:'Ex. : 2^2 × 3 × 7',sol:divChain(n),skill:'Décomposition en facteurs premiers'}},
 pgcd(k){const[g,a,b]=k==='boss'?bigPair(k,12,60,15):bigPair(k,3,24,9);const A=g*a,B=g*b;return{q:`Calcule <b class="m">PGCD(${A} ; ${B})</b>.`,t:'num',a:String(g),traps:[{a:String(A*B/g),msg:"Tu as calculé le PPCM, pas le PGCD.",tag:'PGCD'}],sol:`${A} = ${P(decStr(A))}<br>${B} = ${P(decStr(B))}<br>On garde les facteurs communs, avec le plus petit exposant : PGCD = ${P(decStr(g))} = ${g}.`,skill:'PGCD'}},
 irr(k){const[g,a,b]=k==='boss'?bigPair(k,12,60,15):bigPair(k,3,24,9);const A=g*a,B=g*b;return{q:`Rends irréductible la fraction ${F(A,B)}.`,t:'frac',a:`${a}/${b}`,hint:'Ex. : 7/12',sol:`PGCD(${A} ; ${B}) = ${g}. On divise le numérateur et le dénominateur par ${g} : ${F(A,B)} = ${F(a,b)}.`,skill:'Fractions irréductibles'}},
 divisors(){const n=pick(DIVS);const d=[];for(let i=1;i<=n;i++)if(n%i===0)d.push(i);const pairs=d.filter(x=>x*x<=n).map(x=>`${x} × ${n/x}`);
  return{q:`Donne la liste de tous les diviseurs de <b class="m">${n}</b>.`,t:'list',a:d.join(';'),hint:'Sépare par « ; » : 1 ; 2 ; …',sol:`On cherche les produits égaux à ${n} : ${pairs.join(', ')}.<br>Diviseurs : ${d.join(' ; ')}.`,skill:'Multiples et diviseurs'}},
 vf(){const[s,b,e]=pick(VF2);return{q:`Vrai ou faux : <b>${s}</b>`,t:'choice',a:[b?'Vrai':'Faux'],keys:['Vrai','Faux'],sol:e,skill:'Raisonnements et démonstrations'}},
 parity(){const[ex,c,a,e]=pick(PAR);return{q:`On suppose que ${c}. Le nombre <b class="m">${ex}</b> est-il pair ou impair ?`,t:'choice',a:[a],keys:['Pair','Impair'],sol:e,skill:'Parité'}},
 nbDiv(){let n,f;do{n=2**R(1,4)*3**R(0,3)*5**R(0,2)*7**R(0,1);f=factor(n)}while(n<60||n>2000||f.length<2);const c=f.reduce((t,[,e])=>t*(e+1),1);
  return{q:`Combien <b class="m">${n}</b> a-t-il de diviseurs positifs ?`,t:'num',a:String(c),sol:`${n} = ${P(decStr(n))}. Un diviseur s'écrit ${f.map(([p])=>p+'^…').join(' × ')} avec chaque exposant entre 0 et son maximum : ${f.map(([,e])=>`(${e} + 1)`).join(' × ')} = ${c} diviseurs.`,skill:'Multiples et diviseurs'}},
 bouquets(){const[g,a,b]=bigPair('boss',6,36,12);const A=g*a,B=g*b;return{q:`Un fleuriste a <b>${A} roses</b> et <b>${B} tulipes</b>. Il veut faire le plus grand nombre possible de bouquets identiques en utilisant toutes les fleurs. Combien de bouquets fera-t-il ?`,t:'num',a:String(g),sol:`Le nombre de bouquets doit diviser ${A} et ${B} : on cherche le PGCD.<br>${A} = ${P(decStr(A))}, ${B} = ${P(decStr(B))}, PGCD = ${g}.<br>Chaque bouquet aura ${a} roses et ${b} tulipes.`,skill:'PGCD'}}

/* ---------- Monde 3 : calcul littéral ---------- */
const sg=n=>n<0?`− ${-n}`:`+ ${n}`;
const W3={
 fracAdd(){const b=R(2,9),d=R(2,9),a=R(1,9),c=R(1,9),op=pick(['+','−']);const s=op==='+'?1:-1;const L=lcm(b,d);const num=a*L/b+s*c*L/d;
  return{q:`Calcule et donne le résultat sous forme irréductible : ${F(a,b)} ${op} ${F(c,d)}`,t:'frac',a:fr(num,L),hint:'Ex. : 7/12',traps:[{a:`${a+s*c}/${b+d}`,msg:"On n'additionne jamais les dénominateurs : il faut d'abord un dénominateur commun.",tag:'Fractions'}],sol:`Dénominateur commun ${L} : ${F(a,b)} ${op} ${F(c,d)} = ${F(a*L/b,L)} ${op} ${F(c*L/d,L)} = ${F(num,L)}${fr(num,L)!==`${num}/${L}`?' = '+PF(fr(num,L)):''}.`,skill:'Fractions'}},
 fracMul(){const b=R(2,9),d=pick([b,R(2,9)]),a=R(1,8),c=R(1,8);const tr=[{a:`${a+c}/${b*d}`,msg:"Pour multiplier, on multiplie les numérateurs entre eux (on ne les additionne pas).",tag:'Fractions'}];if(b===d)tr.push({a:fr(a+c,b),msg:"Ça, c'est une addition ! Pour multiplier : numérateur × numérateur, dénominateur × dénominateur.",tag:'Fractions'});
  return{q:`Calcule et donne le résultat sous forme irréductible : ${F(a,b)} × ${F(c,d)}`,t:'frac',a:fr(a*c,b*d),hint:'Ex. : 7/12',traps:tr,sol:`${F(a,b)} × ${F(c,d)} = ${F(a+' × '+c,b+' × '+d)} = ${F(a*c,b*d)}${fr(a*c,b*d)!==`${a*c}/${b*d}`?' = '+PF(fr(a*c,b*d)):''}.<br>Pas besoin de dénominateur commun pour une multiplication.`,skill:'Fractions'}},
 fracDiv(){const b=R(2,9),d=R(2,9),a=R(1,9),c=R(1,9);return{q:`Calcule et donne le résultat sous forme irréductible : ${F(a,b)} ÷ ${F(c,d)}`,t:'frac',a:fr(a*d,b*c),hint:'Ex. : 7/12',traps:[{a:fr(a*c,b*d),msg:"Diviser par une fraction, c'est multiplier par son inverse.",tag:'Fractions'}],sol:`Diviser par ${F(c,d)}, c'est multiplier par ${F(d,c)} : ${F(a,b)} × ${F(d,c)} = ${F(a*d,b*c)}${fr(a*d,b*c)!==`${a*d}/${b*c}`?' = '+PF(fr(a*d,b*c)):''}.`,skill:'Fractions'}},
 pow(){const B=pick([2,3,5,10]);const t=R(0,2);let a,b,E,TE,txt,rule;
  if(t===0){a=RN(-5,7);b=RN(-5,7);E=a+b;TE=a*b;txt=`${B}<sup>${m(a)}</sup> × ${B}<sup>${m(b)}</sup>`;rule=`a<sup>m</sup> × a<sup>p</sup> = a<sup>m+p</sup> : ${m(a)} + (${m(b)}) = ${m(E)}.`}
  else if(t===1){a=RN(-4,8);b=RN(-4,6);E=a-b;TE=a+b;txt=F(`${B}<sup>${m(a)}</sup>`,`${B}<sup>${m(b)}</sup>`);rule=`a<sup>m</sup> ÷ a<sup>p</sup> = a<sup>m−p</sup> : ${m(a)} − (${m(b)}) = ${m(E)}.`}
  else{a=RN(-3,4);b=R(2,3)*pick([1,-1]);E=a*b;TE=a+b;txt=`(${B}<sup>${m(a)}</sup>)<sup>${m(b)}</sup>`;rule=`(a<sup>m</sup>)<sup>p</sup> = a<sup>m×p</sup> : ${m(a)} × (${m(b)}) = ${m(E)}.`}
  return{q:`Écris sous la forme d'une seule puissance de ${B} : <span class="m">${txt}</span>`,t:'num',a:`${B}^(${E})`,show:`${B}<sup>${m(E)}</sup>`,hint:`Ex. : ${B}^-3`,traps:TE===E?[]:[{a:`${B}^(${TE})`,msg:t===2?"(a^m)^p : on multiplie les exposants.":t===1?"Pour une division, on soustrait les exposants.":"Pour un produit, on additionne les exposants (on ne les multiplie pas).",tag:'Puissances'}],sol:rule,skill:'Puissances'}},
 dev1(){const k=RN(-6,6),a=RN(-5,5),b=RN(-9,9);const ex=`${k===-1?'-':k===1?'':k}(${poly([a,b])})`;return{q:`Développe et réduis : ${mx(ex)}`,t:'expr',form:'dev',a:poly([k*a,k*b]),traps:[{a:poly([k*a,b]),msg:`Le facteur ${m(k)} multiplie <b>chaque</b> terme de la parenthèse.`,tag:'Développement'}],sol:`${m(k)} × (${P(poly([a,0]))}) = ${P(poly([k*a,0]))} et ${m(k)} × (${m(b)}) = ${m(k*b)}.`,skill:'Développement'}},
 dev2(){const a=R(1,7),b=RN(-9,9);const inside=poly([a,b]);return{q:`Développe et réduis : ${mx(`-(${inside})`)}`,t:'expr',form:'dev',a:poly([-a,-b]),traps:[{a:poly([-a,b]),msg:"Un signe moins devant une parenthèse change le signe de <b>tous</b> les termes.",tag:'Signe moins devant une parenthèse'}],sol:`On enlève la parenthèse en changeant chaque signe : ${P(inside)} devient ${P(poly([-a,-b]))}.`,skill:'Signe moins devant une parenthèse'}},
 dev3(){const a=RN(-9,9),b=RN(-9,9);return{q:`Développe et réduis : ${mx(`(${poly([1,a])})(${poly([1,b])})`)}`,t:'expr',form:'dev',a:poly([1,a+b,a*b]),traps:a+b?[{a:poly([1,0,a*b]),msg:"Il manque les termes en x : chaque terme de la 1ʳᵉ parenthèse multiplie chaque terme de la 2ᵈᵉ.",tag:'Développement'}]:[],sol:`x × x ${sg(b)}x ${sg(a)}x ${sg(a*b)} = ${P(poly([1,a+b,a*b]))}.`,skill:'Développement'}},
 dev4(){const c=R(2,12),a=RN(-6,6),b=RN(-9,9);return{q:`Développe et réduis : ${mx(`${c}-(${poly([a,b])})`)}`,t:'expr',form:'dev',a:poly([-a,c-b]),traps:[{a:poly([-a,c+b]),msg:"Le moins change aussi le signe du dernier terme de la parenthèse.",tag:'Signe moins devant une parenthèse'},{a:poly([a,c+b]),msg:"Le moins s'applique à tous les termes de la parenthèse.",tag:'Signe moins devant une parenthèse'}],sol:`${c} − (${P(poly([a,b]))}) = ${c} ${P(poly([-a,0])).startsWith('−')?'':'+ '}${P(poly([-a,0]))} ${sg(-b)} = ${P(poly([-a,c-b]))}.`,skill:'Signe moins devant une parenthèse'}},
 id1(){const a=RN(-9,9);return{q:`Développe : ${mx(`(${poly([1,a])})^2`)}`,t:'expr',form:'dev',a:poly([1,2*a,a*a]),traps:[{a:poly([1,0,a*a]),msg:"(a + b)² ≠ a² + b² : il manque le double produit 2ab.",tag:'Identités remarquables'},{a:poly([1,-2*a,a*a]),msg:`Signe du double produit : 2 × x × (${m(a)}) = ${P(poly([2*a,0]))}.`,tag:'Identités remarquables'}],sol:`${a>0?'(a + b)² = a² + 2ab + b²':'(a − b)² = a² − 2ab + b²'} avec a = x et b = ${Math.abs(a)} : x² ${sg(2*a)}x ${sg(a*a)}.`,skill:'Identités remarquables'}},
 id2(){const k=R(2,5),a=R(1,9),s=pick([1,-1]);return{q:`Développe : ${mx(`(${poly([k,s*a])})^2`)}`,t:'expr',form:'dev',a:poly([k*k,2*k*s*a,a*a]),traps:[{a:poly([k,2*k*s*a,a*a]),msg:`(${k}x)² = ${k*k}x² : le carré porte aussi sur ${k}.`,tag:'Identités remarquables'},{a:poly([k*k,-2*k*s*a,a*a]),msg:"Erreur sur le signe du double produit.",tag:'Identités remarquables'},{a:poly([k*k,0,a*a]),msg:"Il manque le double produit 2ab.",tag:'Identités remarquables'},{a:poly([k*k,s*k*a,a*a]),msg:"Le double produit, c'est 2 × a × b : n'oublie pas le 2.",tag:'Identités remarquables'}],sol:`a = ${k}x, b = ${a} : (${k}x)² ${s>0?'+':'−'} 2 × ${k}x × ${a} + ${a}² = ${P(poly([k*k,2*k*s*a,a*a]))}.`,skill:'Identités remarquables'}},
 id3(){const k=R(1,5),a=R(1,9);return{q:`Développe : ${mx(`(${poly([k,-a])})(${poly([k,a])})`)}`,t:'expr',form:'dev',a:poly([k*k,0,-a*a]),traps:[{a:poly([k*k,0,a*a]),msg:"(a − b)(a + b) = a² − b² : c'est un moins.",tag:'Identités remarquables'}],sol:`(a − b)(a + b) = a² − b² avec a = ${k===1?'':k}x et b = ${a} : ${P(poly([k*k,0,-a*a]))}.`,skill:'Identités remarquables'}},
 fact1(){const a=R(1,9),s=pick([1,-1]);return{q:`Factorise : ${mx(poly([1,2*s*a,a*a]))}`,t:'expr',form:'fact',a:`(${poly([1,s*a])})^2`,traps:[{a:`(${poly([1,-s*a])})^2`,msg:"Vérifie en redéveloppant : le signe du terme en x donne le signe dans la parenthèse.",tag:'Factorisation'},{a:`(${poly([1,s*a*2])})^2`,msg:`Le double produit vaut 2 × x × b, donc b = ${a}, pas ${2*a}.`,tag:'Factorisation'}],sol:`On reconnaît a² ${s>0?'+':'−'} 2ab + b² avec a = x et b = ${a} (car ${a*a} = ${a}² et ${2*a} = 2 × ${a}) : ${P(`(${poly([1,s*a])})^2`)}.`,skill:'Factorisation'}},
 fact2(){const k=R(1,4),a=R(1,9);return{q:`Factorise : ${mx(poly([k*k,0,-a*a]))}`,t:'expr',form:'fact',a:`(${poly([k,-a])})(${poly([k,a])})`,traps:[{a:`(${poly([k,-a])})^2`,msg:"a² − b² = (a − b)(a + b), et non (a − b)².",tag:'Factorisation'}],sol:`a² − b² = (a − b)(a + b) avec a = ${k===1?'':k}x et b = ${a}.`,skill:'Factorisation'}},
 neg1(){const a=R(1,8),s=pick([1,-1]);const C=[-1,-2*s*a,-a*a];return{q:`Développe et réduis : ${mx(`-(${poly([1,s*a])})^2`)}`,t:'expr',form:'dev',a:poly(C),traps:[{a:poly([-1,-2*s*a,a*a]),msg:"Le moins s'applique à tous les termes du carré développé, y compris le dernier.",tag:'Signe moins devant une parenthèse'},{a:poly([-1,2*s*a,a*a]),msg:"Développe d'abord le carré entre crochets, puis change le signe de chaque terme.",tag:'Signe moins devant une parenthèse'},{a:poly([1,2*s*a,a*a]),msg:"Tu as oublié le signe moins devant.",tag:'Signe moins devant une parenthèse'}],sol:`On développe d'abord entre crochets : −[${P(poly([1,2*s*a,a*a]))}], puis on change tous les signes : ${P(poly(C))}.`,skill:'Signe moins devant une parenthèse'}},
 neg2(){const k=R(2,5),a=R(1,9);return{q:`Développe et réduis : ${mx(`-(${poly([k,-a])})(${poly([k,a])})`)}`,t:'expr',form:'dev',a:poly([-k*k,0,a*a]),traps:[{a:poly([-k*k,0,-a*a]),msg:"Le moins s'applique aussi au −"+a*a+" : il devient +"+a*a+".",tag:'Signe moins devant une parenthèse'},{a:poly([k*k,0,-a*a]),msg:"Tu as oublié le signe moins devant.",tag:'Signe moins devant une parenthèse'}],sol:`−[${P(poly([k*k,0,-a*a]))}] = ${P(poly([-k*k,0,a*a]))}.`,skill:'Signe moins devant une parenthèse'}},
 neg3(){const a=R(1,7),b=R(1,7);return{q:`Développe et réduis : ${mx(`(${poly([1,a])})^2-(${poly([1,-b])})^2`)}`,t:'expr',form:'dev',a:poly([2*a+2*b,a*a-b*b]),traps:[{a:poly([2*a-2*b,a*a+b*b]),msg:"Le moins devant le 2ᵈ carré change le signe de ses <b>trois</b> termes.",tag:'Signe moins devant une parenthèse'},{a:poly([2,2*a-2*b,a*a+b*b]),msg:"Tu as additionné les deux carrés au lieu de les soustraire.",tag:'Signe moins devant une parenthèse'}],sol:`(${P(poly([1,a]))})² = ${P(poly([1,2*a,a*a]))} et (${P(poly([1,-b]))})² = ${P(poly([1,-2*b,b*b]))}.<br>${P(poly([1,2*a,a*a]))} − [${P(poly([1,-2*b,b*b]))}] = ${P(poly([1,2*a,a*a]))} ${P(poly([-1,2*b,-b*b]))} = ${P(poly([2*a+2*b,a*a-b*b]))}.`,skill:'Signe moins devant une parenthèse'}},
 neg4(){const c=R(1,20),a=R(1,7);return{q:`Développe et réduis : ${mx(`${c}-(${poly([1,-a])})^2`)}`,t:'expr',form:'dev',a:poly([-1,2*a,c-a*a]),traps:[{a:poly([-1,-2*a,c+a*a]),msg:"Après le développement du carré, le moins change le signe de tous ses termes.",tag:'Signe moins devant une parenthèse'},{a:poly([-1,2*a,c+a*a]),msg:"Le dernier terme du carré change aussi de signe : −"+a*a+".",tag:'Signe moins devant une parenthèse'}],sol:`${c} − [${P(poly([1,-2*a,a*a]))}] = ${c} ${P(poly([-1,2*a,-a*a]))} = ${P(poly([-1,2*a,c-a*a]))}.`,skill:'Signe moins devant une parenthèse'}},
 neg5(){const p=R(2,5),a=R(1,6),q=R(2,6),b=R(1,7);return{q:`Développe et réduis : ${mx(`${p}x(${poly([1,-a])})-${q}(${poly([1,b])})`)}`,t:'expr',form:'dev',a:poly([p,-p*a-q,-q*b]),traps:[{a:poly([p,-p*a-q,q*b]),msg:`−${q} × (+${b}) = −${q*b}.`,tag:'Signe moins devant une parenthèse'},{a:poly([p,-p*a+q,-q*b]),msg:`−${q} × x = −${q}x.`,tag:'Signe moins devant une parenthèse'}],sol:`${p}x × x − ${p}x × ${a} − ${q} × x − ${q} × ${b} = ${P(poly([p,-p*a,0]))} − ${q}x − ${q*b} = ${P(poly([p,-p*a-q,-q*b]))}.`,skill:'Signe moins devant une parenthèse'}},

const N_Q=10;
function buildQuestions(spec){
  let gens=[];while(gens.length<N_Q)gens=gens.concat(shuffle(spec.gens));gens=gens.slice(0,N_Q);
  const seen=new Set();const qs=gens.map(g=>{let q;for(let t=0;t<8;t++){try{q=g(spec.kind)}catch(e){q=null}if(q&&!seen.has(q.q))break}seen.add(q.q);return q});
  return spec.kind==='easy'?qs:shuffle(qs)}

const rawHtml=s=>esc(s).replace(/\^\(?(-?[0-9x]+)\)?/g,'<sup>$1</sup>');
const star=on=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="${on?'var(--gold)':'var(--gold-dim)'}"/></svg>`;
const starsRow=n=>`<span class="stars" aria-label="${n||0} étoile(s) sur 3">${[0,1,2].map(i=>star(i<(n||0))).join('')}</span>`;
const heart=on=>`<svg viewBox="0 0 24 24" class="${on?'':'lost'}" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.5 3 5 6.5 5c2 0 3.6 1.2 5.5 3.2C13.9 6.2 15.5 5 17.5 5 21 5 23.1 8.5 21.6 11.8 19.5 16.4 12 21 12 21z" fill="var(--bad)"/></svg>`;
const kid=(w,l)=>w+'-'+l;
const unlocked=(w,l)=>l===0||(S.stars[kid(w,l-1)]||0)>=1;
const totals=()=>{let t=0,mx=0;WORLDS.forEach((w,wi)=>w.levels.forEach((l,li)=>{t+=S.stars[kid(wi,li)]||0;mx+=3}));return[t,mx]};
let G=null;

function home(){
  G=null;const[t,mxs]=totals();
  app.innerHTML=`<div class="screen">
   <header class="hero"><p class="eyebrow">Seconde · Révisions</p><h1>Maths <span>Quest</span></h1><p class="sub">Quatre mondes, cinq niveaux chacun, et un boss au bout.</p>
    <div class="totstars">${star(true)}<b>${t}</b> / ${mxs} étoiles</div></header>
   <div class="worlds">${WORLDS.map((w,wi)=>{const st=w.levels.reduce((s,l,li)=>s+(S.stars[kid(wi,li)]||0),0);
     return `<button class="wcard" style="--wc:${w.color}" data-act="world" data-w="${wi}"><span class="glyph">${w.glyph}</span><span class="meta"><span class="chap">${w.chap}</span><h2>${w.name}</h2><span class="segs">${w.levels.map((l,li)=>`<i class="${(S.stars[kid(wi,li)]||0)>=1?'on':''} ${l.kind==='boss'?'boss':''}"></i>`).join('')}</span><span class="count">${st} / ${w.levels.length*3} étoiles</span></span></button>`}).join('')}</div>
   <button class="btn ghost" data-act="bilan">Envoyer mon bilan</button>
   <p class="foot">8/10 au minimum pour débloquer le niveau suivant.</p></div>`;scrollTo(0,0)}

function world(wi){
  G=null;const w=WORLDS[wi];
  app.innerHTML=`<div class="screen" style="--wc:${w.color}">
   <div class="top"><button class="back" data-act="home" aria-label="Retour">←</button><p class="eyebrow">${w.chap}</p></div>
   <div class="wbanner"><p class="eyebrow">Monde ${wi+1}</p><h2>${w.name}</h2></div>
   <div class="trail">${w.levels.map((l,li)=>{const un=unlocked(wi,li),st=S.stars[kid(wi,li)];const boss=l.kind==='boss';
     const icon=!un?'<span>🔒</span>':boss?'<span>☠</span>':`<span>${li+1}</span>`;
     return `<button class="lvl ${boss?'boss':''} ${!un?'locked':st>=1?'done':''}" ${un?`data-act="start" data-w="${wi}" data-l="${li}"`:'aria-disabled="true"'}>
      <span class="node">${icon}</span><span class="info"><h3>${l.name}</h3><span class="tagrow"><span class="tag ${l.kind}">${l.kind==='easy'?'Facile':l.kind==='hard'?'Difficile':'Boss · 3 vies'}</span>${st!=null?starsRow(st):''}</span>
      ${!un?`<span class="small">Fais 8/10 au niveau précédent</span>`:S.best[kid(wi,li)]?`<span class="small">Meilleur : ${S.best[kid(wi,li)]}</span>`:''}</span></button>`}).join('')}</div></div>`;scrollTo(0,0)}

function start(wi,li){const spec=WORLDS[wi].levels[li];G={wi,li,spec,kind:spec.kind,qs:buildQuestions(spec),i:0,res:[],lives:3,s:'',c:0,sel:null,fb:null,warn:''};play()}

function play(){
  const w=WORLDS[G.wi],q=G.qs[G.i];
  const dots=G.qs.map((_,i)=>{const r=G.res[i];let c='';if(i===G.i&&!G.fb)c='cur';else if(r)c=G.kind==='easy'?(r.ok?'ok':'ko'):(G.kind==='boss'?(r.ok?'done':'ko'):'done');return `<i class="${c}"></i>`}).join('');
  const head=`<div class="phead"><button class="back" data-act="quit" aria-label="Quitter">✕</button><div class="ttl"><b>${G.spec.name}</b><div class="dots">${dots}</div></div>${G.kind==='boss'?`<div class="hearts" id="hearts">${[0,1,2].map(i=>heart(i<G.lives)).join('')}</div>`:''}</div>`;
  const qcard=`<div class="qcard"><span class="qnum">Question ${G.i+1} / ${G.qs.length}</span><div class="qtext">${q.q}</div></div>`;
  if(G.fb){const r=G.fb;
    app.innerHTML=`<div class="play" style="--wc:${w.color}">${head}<div class="qzone">${qcard}
     <div class="fb ${r.ok?'ok':'ko'}"><h3>${r.ok?'Bien joué !':'Pas tout à fait'}</h3>${!r.ok&&r.msg?`<p class="errname">Erreur repérée : ${r.msg}</p>`:''}
      <dl class="kv"><dt>Ta réponse</dt><dd>${rawHtml(r.raw)}</dd>${r.ok?'':`<dt>Attendu</dt><dd>${pretty(q)}</dd>`}</dl><div class="sol">${q.sol}</div></div></div>
     <div class="nextbar"><button class="btn world" data-act="next">${G.i+1<G.qs.length?'Question suivante':'Voir mon résultat'}</button></div></div>`;return}
  const choice=!!q.keys;
  const input=choice?'':`<div class="ansbox" id="ans" aria-live="polite"></div>${q.hint||hintFor(q)?`<p class="hint">${q.hint||hintFor(q)}</p>`:''}`;
  const pad=choice?`<div class="choices">${q.keys.map(k=>`<button class="choice ${k.length>2?'word':''} ${G.sel===k?'sel':''}" data-act="choose" data-v="${k}">${k}</button>`).join('')}<button class="key go" data-act="submit">Valider</button></div>`:kb();
  app.innerHTML=`<div class="play" style="--wc:${w.color}">${head}<div class="qzone">${qcard}${input}<p class="warn" id="warn">${G.warn}</p></div><div class="kbwrap">${pad}</div></div>`;
  if(!choice)drawInput()}
function hintFor(q){return{expr:q.form==='fact'?'Forme factorisée attendue':q.form==='dev'?'Forme développée et réduite':'',frac:'Fraction irréductible, ex. 7/12',set:KS_SET,list:'Sépare par « ; »'}[q.t]||''}
function kb(){const rows=['7','8','9','(',')','BS','4','5','6','×','/','x','1','2','3','+','−','²','0',',',';','^','√','ℝ','[',']','{','}','∞','∪'];
  return `<div class="kb">${rows.map(k=>`<button class="key ${k==='BS'?'alt':''}" data-act="key" data-k="${k}" aria-label="${k==='BS'?'Effacer':k}">${k==='BS'?'⌫':k}</button>`).join('')}<button class="key alt" data-act="key" data-k="L" aria-label="Curseur à gauche">◀</button><button class="key alt" data-act="key" data-k="R" aria-label="Curseur à droite">▶</button><button class="key alt" data-act="key" data-k="∅">∅</button><button class="key go" data-act="submit">Valider</button></div>`}
function drawInput(){const el=document.getElementById('ans');if(!el)return;
  el.innerHTML=G.s?`${rawHtml(G.s.slice(0,G.c))}<span class="caret"></span>${rawHtml(G.s.slice(G.c))}`:`<span class="caret"></span><span class="ph">Écris ta réponse avec le clavier</span>`}
function key(k){if(k==='BS'){if(G.c>0){G.s=G.s.slice(0,G.c-1)+G.s.slice(G.c);G.c--}}else if(k==='L')G.c=Math.max(0,G.c-1);else if(k==='R')G.c=Math.min(G.s.length,G.c+1);else{G.s=G.s.slice(0,G.c)+k+G.s.slice(G.c);G.c+=k.length}
  if(G.warn){G.warn='';const w=document.getElementById('warn');if(w)w.textContent=''}drawInput()}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1400)}
function submit(){
  const q=G.qs[G.i];const raw=q.keys?(G.sel||''):G.s;const r=check(q,raw);
  if(r.invalid){G.warn=r.invalid;const w=document.getElementById('warn');if(w)w.textContent=r.invalid;return}
  const rec={ok:r.ok,raw,msg:r.msg||''};G.res[G.i]=rec;
  if(!r.ok){const tag=r.tag||q.skill;S.errors[tag]=(S.errors[tag]||0)+1;save()}
  if(G.kind==='easy'){G.fb=rec;play();document.querySelector('.qzone').scrollTop=0;return}
  if(G.kind==='boss'&&!r.ok){G.lives--;
    if(G.lives<=0)return finish();
    toast(`Une vie perdue · ${G.lives} restante${G.lives>1?'s':''}`);advance();const h=document.getElementById('hearts');if(h){h.classList.add('shake')}return}
  if(G.kind==='hard')toast('Réponse notée');
  advance()}
function advance(){G.fb=null;G.sel=null;G.s='';G.c=0;G.warn='';if(G.i+1>=G.qs.length)return finish();G.i++;play()}
function finish(){
  const score=G.res.filter(r=>r&&r.ok).length,errs=G.res.filter(r=>r&&!r.ok).length,alive=G.lives>0;
  const st=starsFor(G.kind,score,errs,alive);const id=kid(G.wi,G.li);
  const prev=S.stars[id];S.stars[id]=Math.max(prev||0,st);
  const label=G.kind==='boss'?(alive?`vaincu, ${errs} erreur${errs>1?'s':''}`:`perdu à la question ${G.i+1}`):`${score}/10`;
  if(st>=(prev||0)||!S.best[id])S.best[id]=S.best[id]&&st<(prev||0)?S.best[id]:label;
  S.sessions.push({d:new Date().toISOString(),w:G.wi,l:G.li,r:label,st});S.sessions=S.sessions.slice(-40);save();
  const w=WORLDS[G.wi];const next=G.li+1<w.levels.length?G.li+1:null;
  const title=G.kind==='boss'?(alive?'Boss vaincu !':'Le boss a gagné'):st===3?'Parfait !':st>=1?'Niveau réussi':'Encore un effort';
  const verdict=G.kind==='boss'?(alive?`Tu as terrassé ${G.spec.name}. Toutes les étoiles du monde sont à toi${st<3?' — vise le sans-faute':''}.`:`Trois erreurs : le combat recommence avec de nouveaux exercices.`):st>=1?(next!==null&&!prev?`« ${w.levels[next].name} » est débloqué.`:'Rejoue pour gagner plus d\'étoiles.'):`Il faut 8/10 pour débloquer la suite. Les nombres changent à chaque partie.`;
  const items=G.qs.map((q,i)=>{const r=G.res[i];const cls=!r?'na':r.ok?'ok':'ko';const open=r&&!r.ok&&G.kind!=='easy'?' open':'';
    return `<details class="it ${cls}"${open}><summary><span class="n">${i+1}.</span><span class="s">${!r?'Non traitée':r.ok?'Juste':'Faux'+(r.msg?' — '+r.msg.replace(/<[^>]+>/g,''):'')}</span></summary><div class="qtext">${q.q}</div><dl class="kv">${r?`<dt>Ta réponse</dt><dd>${rawHtml(r.raw)}</dd>`:''}<dt>Attendu</dt><dd>${pretty(q)}</dd></dl><div class="sol">${q.sol}</div></details>`}).join('');
  app.innerHTML=`<div class="screen res" style="--wc:${w.color}">
   <div class="bigstars">${[0,1,2].map(i=>star(i<st)).join('')}</div>
   <h2>${title}</h2><p class="score">${G.kind==='boss'?`${score} juste${score>1?'s':''} · ${errs} erreur${errs>1?'s':''}`:`${score} / 10`}</p><p class="verdict">${verdict}</p>
   <div class="actions">${next!==null&&st>=1?`<button class="btn world" data-act="start" data-w="${G.wi}" data-l="${next}">Niveau suivant</button>`:''}<button class="btn ${st>=1&&next!==null?'ghost':'world'}" data-act="start" data-w="${G.wi}" data-l="${G.li}">${G.kind==='boss'&&!alive?'Retenter le boss':'Rejouer'}</button><button class="btn ghost" data-act="world" data-w="${G.wi}">Carte du monde</button></div>
   <div class="review"><h3>${G.kind==='easy'?'Récapitulatif':'Ta copie corrigée'}</h3>${items}</div></div>`;
  G=null;scrollTo(0,0)}

function bilanText(){
  const[t,mxs]=totals();const d=new Date();let s=`Bilan Maths Quest – ${d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}\nÉtoiles : ${t} / ${mxs}\n`;
  WORLDS.forEach((w,wi)=>{s+=`\n${w.name}\n`;w.levels.forEach((l,li)=>{const st=S.stars[kid(wi,li)];s+=`  ${l.name} : ${st==null?(unlocked(wi,li)?'pas encore joué':'verrouillé'):'★'.repeat(st)+'☆'.repeat(3-st)+` (meilleur : ${S.best[kid(wi,li)]})`}\n`})});
  const week=S.sessions.filter(x=>Date.now()-new Date(x.d)<7*864e5);s+=`\nParties jouées ces 7 derniers jours : ${week.length}\n`;
  const last=S.sessions.slice(-5).reverse();if(last.length){s+='Dernières parties :\n';last.forEach(x=>{const dd=new Date(x.d);s+=`  ${dd.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})} · ${WORLDS[x.w].levels[x.l].name} · ${x.r}\n`})}
  const errs=Object.entries(S.errors).sort((a,b)=>b[1]-a[1]).slice(0,4);if(errs.length){s+='\nErreurs les plus fréquentes :\n';errs.forEach(([k,v])=>s+=`  ${k} : ${v}\n`)}
  return s}
function bilan(){const txt=bilanText();
  app.innerHTML=`<div class="screen bilan"><div class="top"><button class="back" data-act="home" aria-label="Retour">←</button><p class="eyebrow">Bilan</p></div>
   <h2 style="font-size:30px">Mon bilan</h2><p class="small">Copie le bilan, puis colle-le dans Messages pour l'envoyer.</p>
   <pre id="btxt">${esc(txt)}</pre><button class="btn" data-act="copy">Copier le bilan</button><p class="copied" id="copied"></p>
   <a class="btn ghost" href="sms:&body=${encodeURIComponent(txt)}" style="text-decoration:none">Ouvrir Messages</a>
   <p class="small">Si « Ouvrir Messages » ne fait rien, utilise « Copier » puis colle dans la conversation.</p></div>`;scrollTo(0,0)}
function copy(){const txt=bilanText();const done=ok=>{document.getElementById('copied').textContent=ok?'Copié ! Colle-le dans Messages.':'Sélectionne le texte au-dessus et copie-le.'};
  try{navigator.clipboard.writeText(txt).then(()=>done(true),()=>{selectPre();done(false)})}catch(e){selectPre();done(false)}}
function selectPre(){const el=document.getElementById('btxt');const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='home')home();else if(a==='world')world(+b.dataset.w);else if(a==='start')start(+b.dataset.w,+b.dataset.l);
  else if(a==='quit'){const wi=G.wi;world(wi)}else if(a==='key')key(b.dataset.k);
  else if(a==='choose'){G.sel=b.dataset.v;document.querySelectorAll('.choice').forEach(c=>c.classList.toggle('sel',c.dataset.v===G.sel));if(G.warn){G.warn='';document.getElementById('warn').textContent=''}}
  else if(a==='submit')submit();else if(a==='next')advance();else if(a==='bilan')bilan();else if(a==='copy')copy()});
document.addEventListener('keydown',e=>{if(!G||e.metaKey||e.ctrlKey)return;
  if(G.fb){if(e.key==='Enter'){e.preventDefault();advance()}return}
  const q=G.qs[G.i];if(e.key==='Enter'){e.preventDefault();submit();return}if(q.keys)return;
  const map={'*':'×','-':'−',Backspace:'BS',ArrowLeft:'L',ArrowRight:'R'};const k=map[e.key]||e.key;
  if(k.length===1&&/[0-9x+×−\/^()\[\]{};,√²∞∪ℝ∅.]/.test(k)||['BS','L','R'].includes(k)){e.preventDefault();key(k)}});
home();
}
</script>

</body>
