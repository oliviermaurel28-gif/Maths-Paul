<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maths Quest">
<meta name="color-scheme" content="light dark">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Maths Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: cahier à petits carreaux ; une colonne d'écrans (accueil → monde → partie → résultat), clavier maths fixé en bas pendant une partie */
:root{
  --paper:#F2F5FA; --grid:rgba(52,92,170,.10); --ink:#16213A; --muted:#5B6787; --card:#FFFFFF; --line:#D3DCEB;
  --key:#FFFFFF; --key-alt:#E3EAF5; --key-fg:#16213A; --shadow:0 1px 0 rgba(22,33,58,.18);
  --gold:#F0B000; --gold-dim:#D7DEEA; --good:#16946A; --good-bg:#E2F5EC; --bad:#D13F38; --bad-bg:#FCE7E5;
  --w1:#0C9A95; --w2:#D98200; --w3:#DF4B45; --w4:#7356DA;
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --f-body:"Atkinson Hyperlegible",-apple-system,"Segoe UI",sans-serif;
  --f-math:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101727; --grid:rgba(130,165,235,.07); --ink:#E7ECF6; --muted:#98A4C2; --card:#1A2338; --line:#2B3651;
  --key:#232D46; --key-alt:#2F3B58; --key-fg:#E7ECF6; --shadow:0 1px 0 rgba(0,0,0,.5);
  --gold:#FFC531; --gold-dim:#36415C; --good:#3CC48F; --good-bg:#15372B; --bad:#FF6B63; --bad-bg:#3E1E21;
  --w1:#27C2BC; --w2:#F59F1F; --w3:#FF6A63; --w4:#9479F5; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101727; --grid:rgba(130,165,235,.07); --ink:#E7ECF6; --muted:#98A4C2; --card:#1A2338; --line:#2B3651;
  --key:#232D46; --key-alt:#2F3B58; --key-fg:#E7ECF6; --shadow:0 1px 0 rgba(0,0,0,.5);
  --gold:#FFC531; --gold-dim:#36415C; --good:#3CC48F; --good-bg:#15372B; --bad:#FF6B63; --bad-bg:#3E1E21;
  --w1:#27C2BC; --w2:#F59F1F; --w3:#FF6A63; --w4:#9479F5; color-scheme:dark}
html,body{height:100%}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
#app{height:100%;max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--w4);outline-offset:2px}
.screen{min-height:100%;display:flex;flex-direction:column;gap:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 28px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
.eyebrow{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.m{font-family:var(--f-math);font-weight:500;white-space:nowrap}
sup{font-size:.68em;line-height:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-family:var(--f-math);font-size:.92em;margin:0 2px}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}

/* accueil */
.hero{display:flex;flex-direction:column;gap:6px;padding-top:8px}
.hero h1{font-size:44px;color:var(--ink)}
.hero h1 span{color:var(--w3)}
.sub{margin:0;color:var(--muted)}
.totstars{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;margin-top:6px;padding:6px 12px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-variant-numeric:tabular-nums;color:var(--muted)}
.totstars b{color:var(--ink);font-size:18px}
.worlds{display:flex;flex-direction:column;gap:12px}
.wcard{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 3px 0 var(--line);transition:transform .12s}
.wcard:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.glyph{width:64px;height:64px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-math);font-weight:700;font-size:28px;color:#fff;background:var(--wc)}
.wcard .meta{min-width:0;display:flex;flex-direction:column;gap:4px}
.wcard h2{font-size:21px}
.wcard .chap{font-size:13px;color:var(--muted)}
.segs{display:flex;gap:4px;margin-top:2px}
.segs i{flex:1;height:7px;border-radius:4px;background:var(--gold-dim)}
.segs i.on{background:var(--wc)}
.segs i.boss{flex:1.4}
.wcard .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:12px;font-weight:700;font-size:17px;background:var(--ink);color:var(--paper);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.world{background:var(--wc);color:#fff}
.foot{margin:0;font-size:13px;color:var(--muted);text-align:center}

/* carte d'un monde */
.top{display:flex;align-items:center;gap:10px}
.back{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1.5px solid var(--line);font-size:20px;flex:none}
.wbanner{background:var(--wc);color:#fff;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:4px}
.wbanner .eyebrow{color:rgba(255,255,255,.85)}
.wbanner h2{font-size:30px}
.trail{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:4px}
.trail::before{content:"";position:absolute;left:31px;top:30px;bottom:40px;border-left:3px dashed var(--line)}
.lvl{position:relative;display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;text-align:left;padding:4px 0}
.node{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:24px;background:var(--card);border:3px solid var(--wc);color:var(--wc);box-shadow:0 3px 0 var(--line)}
.lvl.done .node{background:var(--wc);color:#fff}
.lvl.locked .node{border-color:var(--line);color:var(--muted);background:var(--paper)}
.lvl.boss .node{width:64px;height:64px;margin-left:-4px;border-radius:16px;transform:rotate(45deg)}
.lvl.boss .node>*{transform:rotate(-45deg)}
.lvl .info{display:flex;flex-direction:column;gap:3px;min-width:0}
.lvl h3{font-size:19px}
.lvl.locked h3{color:var(--muted)}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--key-alt);color:var(--muted)}
.tag.hard{background:var(--bad-bg);color:var(--bad)}
.tag.boss{background:var(--ink);color:var(--paper)}
.stars{display:inline-flex;gap:2px}
.stars svg{width:16px;height:16px}

/* partie */
.play{height:100%;display:flex;flex-direction:column}
.phead{display:flex;align-items:center;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 8px}
.phead .ttl{flex:1;min-width:0}
.phead .ttl b{display:block;font-family:var(--f-display);font-weight:400;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:4px;margin-top:4px}
.dots i{width:100%;max-width:22px;height:6px;border-radius:3px;background:var(--gold-dim)}
.dots i.cur{background:var(--wc)}
.dots i.ok{background:var(--good)}
.dots i.ko{background:var(--bad)}
.dots i.done{background:var(--muted)}
.hearts{display:flex;gap:2px}
.hearts svg{width:24px;height:24px}
.hearts .lost{opacity:.22}
.qzone{flex:1;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px 10px;display:flex;flex-direction:column;gap:12px}
.qcard{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.qnum{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--wc)}
.qtext{font-size:18px;line-height:1.55;overflow-wrap:anywhere}
.qtext .m{white-space:normal}
.ansbox{background:var(--card);border:2px solid var(--wc);border-radius:12px;min-height:56px;padding:10px 14px;font-family:var(--f-math);font-size:22px;display:flex;align-items:center;flex-wrap:wrap;overflow-wrap:anywhere}
.ansbox .ph{color:var(--muted);font-family:var(--f-body);font-size:15px}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--wc);margin:0 1px;vertical-align:middle;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hint{font-size:13px;color:var(--muted);margin:-4px 2px 0}
.warn{font-size:14px;color:var(--bad);font-weight:700;margin:0 2px}
.kbwrap{background:var(--key-alt);border-top:1.5px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:8px calc(8px + env(safe-area-inset-bottom,0px))}
.kb{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:520px;margin:0 auto}
.key{min-height:44px;border-radius:9px;background:var(--key);color:var(--key-fg);font-family:var(--f-math);font-size:19px;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none}
.key:active{transform:translateY(1px);filter:brightness(.92)}
.key.alt{background:var(--key-alt);border:1.5px solid var(--line);font-size:17px}
.key.go{grid-column:span 3;background:var(--wc);color:#fff;font-family:var(--f-body);font-weight:700;font-size:17px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;max-width:520px;margin:0 auto}
.choice{min-height:56px;border-radius:12px;background:var(--key);box-shadow:var(--shadow);font-size:22px;font-family:var(--f-math);font-weight:700}
.choice.word{font-family:var(--f-body);font-size:18px}
.choice.sel{background:var(--wc);color:#fff}
.choices .key.go{grid-column:1/-1;min-height:52px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;z-index:30;animation:pop 1.3s forwards;white-space:nowrap}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-8px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* correction */
.fb{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;border:1.5px solid}
.fb.ok{background:var(--good-bg);border-color:var(--good)}
.fb.ko{background:var(--bad-bg);border-color:var(--bad)}
.fb h3{font-size:22px}
.fb.ok h3{color:var(--good)}
.fb.ko h3{color:var(--bad)}
.errname{margin:0;font-weight:700;color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline;font-size:15px}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;font-family:var(--f-math);font-size:17px;overflow-wrap:anywhere}
.sol{font-size:15px;line-height:1.6;border-top:1px dashed var(--line);padding-top:8px;overflow-wrap:anywhere}
.fb .sol{border-color:currentColor;border-top-color:rgba(127,127,127,.35)}
.nextbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(12px + env(safe-area-inset-bottom,0px));background:var(--key-alt);border-top:1.5px solid var(--line)}
.nextbar .btn{width:100%}

/* résultat */
.res{align-items:stretch}
.bigstars{display:flex;justify-content:center;gap:10px;padding-top:10px}
.bigstars svg{width:58px;height:58px}
.bigstars svg:nth-child(2){transform:translateY(-12px)}
.res h2{font-size:34px;text-align:center}
.score{text-align:center;font-family:var(--f-math);font-size:20px;color:var(--muted);margin:0}
.verdict{text-align:center;margin:0}
.actions{display:flex;flex-direction:column;gap:10px}
.review{display:flex;flex-direction:column;gap:8px}
.review h3{font-size:20px;margin-top:6px}
details.it{background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--line);border-radius:12px;padding:10px 12px}
details.it.ok{border-left-color:var(--good)}
details.it.ko{border-left-color:var(--bad)}
details.it.na{border-left-color:var(--muted)}
details.it summary{cursor:pointer;display:flex;gap:8px;align-items:baseline;list-style:none}
details.it summary::-webkit-details-marker{display:none}
details.it summary .n{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
details.it summary .s{flex:1;min-width:0;font-size:15px}
details.it[open] summary{margin-bottom:8px}
details.it .qtext{font-size:16px}

/* bilan */
.bilan pre{white-space:pre-wrap;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px;font-family:var(--f-math);font-size:13px;line-height:1.55;margin:0;user-select:text;-webkit-user-select:text;overflow-wrap:anywhere}
.copied{color:var(--good);font-weight:700;text-align:center;margin:0}
.small{font-size:14px;color:var(--muted);margin:0}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- v2 : comptes, entraînement, espace parent ---------- */
#app.wide{max-width:1040px}
a{color:var(--w4)}
.linkbtn{font-size:inherit;color:var(--w4);text-decoration:underline;padding:6px 2px}
.foot a{color:var(--w4)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:20px}
.form{display:flex;flex-direction:column;gap:8px}
.form label{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.form input,.form select{box-sizing:border-box;font:inherit;font-size:17px;min-height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);padding:0 12px;width:100%;min-width:0}
.form input:focus-visible,.form select:focus-visible{outline:3px solid var(--w4);outline-offset:1px}
.form.inline{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end;gap:10px}
.form.inline .btn,.form.inline .warn{grid-column:1/-1}
.codein{font-family:var(--f-math);font-size:28px!important;letter-spacing:.3em;text-align:center;text-transform:uppercase}
.screen.narrow{max-width:460px;margin:0 auto}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{min-height:40px;padding:0 16px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-weight:700}
.tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.train{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--ink);color:var(--paper);border-radius:14px;padding:14px 16px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.train:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.train.busy{opacity:.6}
.train .tt{font-family:var(--f-display);font-size:22px}
.train .ts{font-size:14px;opacity:.85}
.train .th{font-size:13px;opacity:.75;overflow-wrap:anywhere}

/* espace parent */
.screen.pwide{gap:16px}
.ptop{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 16px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-weight:700}
.chip small{color:var(--muted);font-weight:400}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.on small{color:var(--paper);opacity:.8}
.chip.add{border-style:dashed;color:var(--muted)}
.pr{display:flex;justify-content:space-between;align-items:center}
.ptitle{font-size:30px}
.ptitle small{font-size:16px;color:var(--muted);font-family:var(--f-body)}
.codebig{font-family:var(--f-math);font-weight:700;font-size:40px;letter-spacing:.25em;margin:0;overflow-wrap:anywhere}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi b{font-family:var(--f-display);font-weight:400;font-size:28px;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:13px}
.up{color:var(--good);font-weight:700}
.down{color:var(--bad);font-weight:700}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.pgrid .span2{grid-column:1/-1}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px 6px 0;white-space:nowrap}
td{padding:8px 10px 8px 0;border-top:1px solid var(--line);vertical-align:top}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--key-alt);color:var(--muted);margin:1px 2px 1px 0;white-space:nowrap}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.mid{background:rgba(217,130,0,.16);color:var(--w2)}
.chart{width:100%;height:auto;max-height:260px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .gt{fill:var(--muted);font-size:12px;font-family:var(--f-body)}
.chart .ln{fill:none;stroke:var(--w4);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart .dt{fill:var(--muted);opacity:.55}
.pace,.seances,.flist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pace li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
.pace li small,.pace li .pill{grid-column:1/-1}
.pace li b{font-variant-numeric:tabular-nums}
.note{margin:0;font-size:14px;background:var(--bad-bg);color:var(--ink);border-left:4px solid var(--bad);border-radius:8px;padding:8px 10px}
.bars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.bars li{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:14px}
.bars li i{grid-column:1/-1;height:8px;border-radius:4px;background:var(--bad);display:block}
.bars li b{font-variant-numeric:tabular-nums}
.wprog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.wprog li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:14px}
.wl{display:flex;gap:4px}
.wl i{width:22px;height:12px;border-radius:4px;background:var(--gold-dim);display:block}
.wl i.boss{width:30px}
.wl i.s1{background:#C99700}.wl i.s2{background:#E4AA00}.wl i.s3{background:var(--gold)}
.seances li{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:baseline;font-size:14px;border-top:1px solid var(--line);padding-top:8px}
.seances li:first-child{border-top:0;padding-top:0}
.seances li span:nth-child(2){min-width:0;overflow-wrap:anywhere}

/* ---------- français : texte et réponses libres ---------- */

<div id="app"></div>
<script>
/* =====================================================================
   OUTILS MATHS
   ===================================================================== */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const RN=(a,b)=>{let v;do v=R(a,b);while(v===0);return v};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a};
const lcm=(a,b)=>a/gcd(a,b)*b;
const isPrime=n=>{if(n<2)return false;for(let p=2;p*p<=n;p++)if(n%p===0)return false;return true};
const primesUpTo=k=>{const r=[];for(let p=2;p<=k;p++)if(isPrime(p))r.push(p);return r};
const factor=n=>{const f=[];let p=2;while(n>1){let e=0;while(n%p===0){n/=p;e++}if(e)f.push([p,e]);p++}return f};
const decStr=n=>factor(n).map(([p,e])=>e>1?`${p}^${e}`:`${p}`).join('*');
const fr=(n,d)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;n/=g;d/=g;return d===1?`${n}`:`${n}/${d}`};
const m=n=>n<0?'−'+(-n):String(n);
const fmtD=v=>String(+v.toFixed(6)).replace('.',',').replace('-','−');
function poly(cs){const deg=cs.length-1;let s='';cs.forEach((c,i)=>{const p=deg-i;if(c===0)return;const sign=c<0?'-':(s?'+':'');const a=Math.abs(c);const coef=(a===1&&p>0)?'':String(a);const v=p===0?'':(p===1?'x':'x^'+p);s+=sign+coef+v});return s||'0'}
/* Mise en forme jolie d'une écriture « plate » (x^2, -, *) */
function P(s){s=String(s);s=s.replace(/([0-9xπ)²³√])([+\-])/g,'$1 $2 ');s=s.replace(/\^\(([^)]*)\)/g,'<sup>$1</sup>').replace(/\^(-?[0-9x]+)/g,'<sup>$1</sup>');return s.replace(/\*/g,' × ').replace(/-/g,'−').replace(/;/g,' ; ')}
function F(n,d){if(typeof n==='string'||typeof d==='string')return `<span class="fr"><span>${n}</span><span>${d}</span></span>`;const neg=(n<0)!==(d<0);return `${neg?'−':''}<span class="fr"><span>${Math.abs(n)}</span><span>${Math.abs(d)}</span></span>`}
function PF(s){const k=String(s).match(/^(-?)(\d+)\/(\d+)$/);return k?F((k[1]?-1:1)*k[2],+k[3]):P(s)}
const mx=s=>`<span class="m">${P(s)}</span>`;

/* ----- lecteur d'expressions ----- */
function norm0(s){return String(s).replace(/\s+/g,'').replace(/[−–]/g,'-').replace(/[×·]/g,'*').replace(/÷/g,'/').replace(/X/g,'x')}
function parseExpr(src){
  const s=norm0(src).replace(/,/g,'.');const t=[];let i=0;
  while(i<s.length){const c=s[i];
    if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;const str=s.slice(i,j);if((str.match(/\./g)||[]).length>1||str==='.')throw 0;t.push({k:'n',v:parseFloat(str)});i=j;continue}
    if(c==='x'){t.push({k:'x'});i++;continue}
    if(c==='π'){t.push({k:'n',v:Math.PI});i++;continue}
    if(c==='∞'){t.push({k:'n',v:Infinity});i++;continue}
    if('+-*/^()√²³'.includes(c)){t.push({k:c});i++;continue}
    throw 0}
  let p=0;const peek=()=>t[p];const eat=k=>{if(t[p]&&t[p].k===k){p++;return true}return false};
  const starts=tk=>tk&&(tk.k==='n'||tk.k==='x'||tk.k==='('||tk.k==='√');
  function expr(){let f=term();while(peek()&&(peek().k==='+'||peek().k==='-')){const op=t[p++].k;const g=term(),a=f;f=op==='+'?x=>a(x)+g(x):x=>a(x)-g(x)}return f}
  function term(){let f=unary();for(;;){const tk=peek();if(tk&&(tk.k==='*'||tk.k==='/')){p++;const g=unary(),a=f;f=tk.k==='*'?x=>a(x)*g(x):x=>a(x)/g(x)}else if(starts(tk)){const g=power(),a=f;f=x=>a(x)*g(x)}else break}return f}
  function unary(){if(eat('-')){const g=unary();return x=>-g(x)}if(eat('+'))return unary();return power()}
  function power(){const b=post();if(eat('^')){const e=unary();return x=>Math.pow(b(x),e(x))}return b}
  function post(){let f=prim();for(;;){if(eat('²')){const a=f;f=x=>a(x)**2}else if(eat('³')){const a=f;f=x=>a(x)**3}else break}return f}
  function prim(){const tk=t[p++];if(!tk)throw 0;if(tk.k==='n'){const v=tk.v;return()=>v}if(tk.k==='x')return x=>x;
    if(tk.k==='('){const f=expr();if(!eat(')'))throw 0;return f}
    if(tk.k==='√'){const g=prim();return x=>Math.sqrt(g(x))}throw 0}
  if(!t.length)throw 0;const f=expr();if(p<t.length)throw 0;return f}
const eqNum=(a,b)=>{if(a===b)return true;if(Number.isNaN(a)&&Number.isNaN(b))return true;if(!isFinite(a)||!isFinite(b))return false;if(a===0||b===0)return Math.abs(a-b)<1e-12;return Math.abs(a-b)<=1e-9*Math.max(Math.abs(a),Math.abs(b))};
const XS=[0.37,1.91,-1.3,2.73,-0.58,3.17];
const eqExpr=(u,e)=>{const fu=parseExpr(u),fe=parseExpr(e);return XS.every(x=>eqNum(fu(x),fe(x)))};
const valN=s=>{if(/x/i.test(s))throw 0;return parseExpr(s)(0)};
function parseSet(src){
  const s=String(src).replace(/\s+/g,'').replace(/[−–]/g,'-').replace(/[Uu]/g,'∪');
  if(s==='∅'||s==='{}'||s==='{∅}')return [];
  const out=[];
  for(const part of s.split('∪')){
    if(part==='ℝ'||part==='R'){out.push({lo:-Infinity,hi:Infinity,lc:false,hc:false});continue}
    let k=part.match(/^\{(.*)\}$/);
    if(k){for(const e of k[1].split(';'))if(e!=='')out.push({pt:valN(e)});continue}
    k=part.match(/^([\[\]])([^;]+);([^;]+)([\[\]])$/);
    if(!k)throw 0;
    out.push({lo:valN(k[2]),hi:valN(k[3]),lc:k[1]==='[',hc:k[4]===']'})}
  return out.sort((a,b)=>('pt'in a?a.pt:a.lo)-('pt'in b?b.pt:b.lo))}
const eqSet=(u,e)=>{const A=parseSet(u),B=parseSet(e);if(A.length!==B.length)return false;return A.every((a,i)=>{const b=B[i];if('pt'in a||'pt'in b)return('pt'in a)&&('pt'in b)&&eqNum(a.pt,b.pt);return eqNum(a.lo,b.lo)&&eqNum(a.hi,b.hi)&&a.lc===b.lc&&a.hc===b.hc})};
const parseList=s=>norm0(s).split(';').filter(x=>x!=='').map(valN).sort((a,b)=>a-b);
const eqList=(u,e)=>{const A=parseList(u),B=parseList(e);return A.length===B.length&&A.every((v,i)=>eqNum(v,B[i]))};
const nrm=s=>String(s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function topLevelSum(raw){const s=norm0(raw);let d=0;for(let i=0;i<s.length;i++){const c=s[i];if(c==='(')d++;else if(c===')')d--;else if(d===0&&(c==='+'||c==='-')&&i>0&&!'(*^/'.includes(s[i-1]))return true}return false}

/* ----- vérification d'une réponse ----- */
const EQ={num:(u,e)=>eqNum(valN(u),valN(e)),frac:(u,e)=>eqNum(valN(u),valN(e)),rad:(u,e)=>eqNum(valN(u),valN(e)),expr:eqExpr,set:eqSet,list:eqList};
function check(q,raw){
  raw=String(raw||'').trim();
  if(!raw)return{invalid:q.t==='choice'?'Choisis une réponse.':'Écris une réponse avant de valider.'};
  if(q.t==='choice'){let n=nrm(raw);return{ok:q.a.some(a=>nrm(a)===n)}}
  if(q.t==='kw'){const n=' '+nrm(raw).replace(/[^a-z0-9]+/g,' ').trim()+' ';
    return{ok:q.groups.every(g=>g.some(w=>n.includes(' '+w+' ')||n.includes(' '+w)))}}
  if(q.t==='ord'){const n=raw.toUpperCase().replace(/[^A-Z]/g,'');return{ok:n===q.a}}
  if(q.t==='dec')return checkDec(raw,q.n);
  let ok;
  try{ok=EQ[q.t](raw,q.a)}catch(e){
    return{invalid:q.t==='set'?'Écriture non reconnue. Exemples : [2 ; 5[ , {−1 ; 4} , ∅. Sépare avec « ; ».':q.t==='list'?'Écriture non reconnue : sépare les nombres par « ; ».':'Écriture non reconnue : vérifie les parenthèses et les signes.'}}
  if(ok){
    if(q.t==='expr'&&q.form==='dev'&&/\(/.test(raw))return{ok:false,msg:"Le résultat est juste, mais il n'est pas développé : il reste des parenthèses.",tag:'Forme attendue'};
    if(q.t==='expr'&&q.form==='fact'&&(!/\(/.test(raw)||topLevelSum(raw)))return{ok:false,msg:"Le résultat est juste, mais il n'est pas factorisé : on attend un produit.",tag:'Forme attendue'};
    if(q.t==='frac'){const s=norm0(raw).replace(/[()]/g,'');const k=s.match(/^(-?)(\d+)(?:\/(-?)(\d+))?$/);
      if(!k)return{ok:false,msg:'Le résultat est juste, mais donne-le sous forme de fraction irréductible.',tag:'Fractions'};
      if(k[4]&&(gcd(+k[2],+k[4])!==1||+k[4]===1))return{ok:false,msg:"La fraction est juste mais pas irréductible : simplifie encore.",tag:'Fractions'}}
    if(q.t==='rad'){const s=norm0(raw);const k=s.match(/^(\d*)\*?√(\d+)$/);
      if(k){const n=+k[2];for(let d=2;d*d<=n;d++)if(n%(d*d)===0)return{ok:false,msg:`On peut encore simplifier : ${d*d} divise ${n}.`,tag:'Racines carrées'}}
      else if(!/^\d+$/.test(s))return{ok:false,msg:'Écris le résultat sous la forme a√b.',tag:'Racines carrées'}}
    return{ok:true}}
  if(q.t==='set'){try{if(parseSet(raw).some(I=>!('pt'in I)&&((I.lo===-Infinity&&I.lc)||(I.hi===Infinity&&I.hc))))return{ok:false,msg:"Du côté de l'infini, le crochet est toujours ouvert.",tag:'Intervalles'}}catch(e){}}
  for(const tr of(q.traps||[])){try{if(EQ[q.t](raw,tr.a))return{ok:false,msg:tr.msg,tag:tr.tag}}catch(e){}}
  return{ok:false}}
function checkDec(raw,n){
  const parts=norm0(raw).split('*');let prod=1;const bad=[];
  for(const part of parts){const k=part.match(/^(\d+)(?:\^\(?(\d+)\)?|(²)|(³))?$/);
    if(!k)return{invalid:'Écris un produit, par exemple 2^2 × 3 × 7.'};
    const p=+k[1],e=k[2]?+k[2]:k[3]?2:k[4]?3:1;if(!isPrime(p))bad.push(p);prod*=p**e}
  if(prod!==n)return{ok:false,msg:`Ton produit vaut ${prod}, pas ${n}.`};
  if(bad.length)return{ok:false,msg:`${bad[0]} n'est pas un nombre premier : il faut continuer à décomposer.`,tag:'Décomposition en facteurs premiers'};
  return{ok:true}}
function pretty(q){if(q.show)return q.show;if(q.t==='choice')return q.a[0];if(q.t==='frac')return PF(q.a);return P(q.a)}

/* =====================================================================
   CONTENU — un objet par monde. Pour ajouter un chapitre :
   écrire ses générateurs puis ajouter une entrée dans WORLDS (en bas).
   Chaque générateur reçoit le type de niveau ('easy' | 'hard' | 'boss')
   et renvoie { q, t, a, sol, skill, traps?, form?, keys? }.
   ===================================================================== */
const absTxt=a=>a>0?`|x − ${a}|`:`|x + ${-a}|`;
const absNote=a=>a<0?`${absTxt(a)} = |x − (${m(a)})| : c'est la distance entre x et <b>${m(a)}</b> (et pas ${-a}).`:`${absTxt(a)} est la distance entre x et ${a}.`;
const KS_SET='Sépare les valeurs par « ; ». Ensemble vide : ∅';

/* ---------- Monde 1 : ensembles de nombres ---------- */
const W1items=[
 ()=>{const n=R(2,99);return[n,'ℕ',`${n} est un entier positif : il est dans ℕ, donc aussi dans ℤ, 𝔻, ℚ et ℝ.`]},
 ()=>{const n=R(2,99);return['−'+n,'ℤ',`−${n} est un entier négatif : il est dans ℤ mais pas dans ℕ.`]},
 ()=>{const u=R(0,15),c=R(1,9),neg=Math.random()<.4;const t=(neg?'−':'')+u+','+c;return[t,'𝔻',`${t} a un nombre fini de chiffres après la virgule : c'est un décimal, mais pas un entier.`]},
 ()=>{const d=pick([4,8,20,25]);let n;do n=R(1,60);while(gcd(n,d)!==1);return[F(n,d),'𝔻',`${F(n,d)} = ${fmtD(n/d)} : un nombre fini de chiffres après la virgule, c'est un décimal.`]},
 ()=>{const d=pick([3,6,7,9,11,12]);let n;do n=R(1,40);while(gcd(n,d)!==1);return[F(n,d),'ℚ',`${F(n,d)} est irréductible et son dénominateur contient un facteur premier autre que 2 et 5 : son écriture décimale ne s'arrête jamais. C'est un rationnel non décimal.`]},
 ()=>{const p=pick([2,3,5,6,7,10]);return['√'+p,'ℝ',`√${p} est irrationnel : il n'est pas dans ℚ.`]},
 ()=>{const k=R(2,12);return['√'+k*k,'ℕ',`√${k*k} = ${k}, un entier positif.`]},
 ()=>{const k=R(2,9),d=pick([2,3,4]);return[F(-k*d,d),'ℤ',`${F(-k*d,d)} = −${k}, un entier négatif.`]},
 ()=>['π','ℝ',"π est irrationnel."]];
const VF1=[['𝔻 ⊂ ℚ',1,"Tout décimal s'écrit a/10ⁿ : c'est un quotient d'entiers, donc un rationnel."],['ℚ ⊂ 𝔻',0,"1/3 est rationnel mais pas décimal (0,333… ne s'arrête jamais)."],['−5 ∈ ℕ',0,"ℕ ne contient que les entiers positifs ou nuls."],['0,25 ∈ ℚ',1,"0,25 = 1/4, quotient de deux entiers."],['√9 ∈ ℤ',1,"√9 = 3, qui est un entier."],['1/3 ∈ 𝔻',0,"1/3 = 0,333… : pas de nombre fini de chiffres après la virgule."],['π ∈ ℚ',0,"π est irrationnel."],['ℤ ⊂ 𝔻',1,"Tout entier n s'écrit n/10⁰ : c'est un décimal."],['√2 ∈ ℚ',0,"√2 est irrationnel (démonstration par l'absurde du cours)."],['7/4 ∈ 𝔻',1,"7/4 = 1,75."],['−12/4 ∈ ℤ',1,"−12/4 = −3."],['0 ∈ ℕ',1,"0 est un entier naturel."],['√16/4 ∈ ℕ',1,"√16/4 = 4/4 = 1."],['2/3 ∈ 𝔻',0,"2/3 = 0,666… ne s'arrête jamais."]];
const W1={
 smallest(){const[x,a,e]=pick(W1items)();return{q:`Quel est le plus petit ensemble de nombres qui contient <b class="m">${x}</b> ?`,t:'choice',a:[a],keys:['ℕ','ℤ','𝔻','ℚ','ℝ'],sol:`${e}<br>Rappel : ℕ ⊂ ℤ ⊂ 𝔻 ⊂ ℚ ⊂ ℝ.`,skill:'Ensembles de nombres'}},
 vf(){const[s,b,e]=pick(VF1);return{q:`Vrai ou faux : <b class="m">${s}</b>`,t:'choice',a:[b?'Vrai':'Faux'],keys:['Vrai','Faux'],sol:e,skill:'Ensembles de nombres'}},
 ineq(){const a=R(-9,9),b=a+R(1,8);const L=[[`x ≥ ${m(a)}`,`[${a};+∞[`],[`x > ${m(a)}`,`]${a};+∞[`],[`x ≤ ${m(a)}`,`]-∞;${a}]`],[`x < ${m(a)}`,`]-∞;${a}[`],[`${m(a)} ≤ x < ${m(b)}`,`[${a};${b}[`],[`${m(a)} < x ≤ ${m(b)}`,`]${a};${b}]`],[`${m(a)} ≤ x ≤ ${m(b)}`,`[${a};${b}]`]];const[txt,ans]=pick(L);
  return{q:`Écris sous forme d'intervalle l'ensemble des réels x tels que <b class="m">${txt}</b>.`,t:'set',a:ans,hint:'Ex. : [2 ; 5[ — la valeur, pas la lettre x',sol:"Crochet <b>tourné vers le nombre</b> s'il est inclus (≤ ou ≥), <b>tourné vers l'extérieur</b> s'il est exclu (< ou >). Du côté de l'infini, le crochet est toujours ouvert.",skill:'Intervalles'}},
 belongs(){const a=R(-8,5),b=a+R(2,7);const l=pick(['[',']']),r=pick(['[',']']);const c=pick([a,b,a,b,a+1,b+1,a-1]);const inI=(c>a&&c<b)||(c===a&&l==='[')||(c===b&&r===']');
  let e=c===a?`${m(a)} est une borne : le crochet « ${l} » est ${l==='['?"tourné vers le nombre, la borne est incluse":"tourné vers l'extérieur, la borne est exclue"}.`:c===b?`${m(b)} est une borne : le crochet « ${r} » est ${r===']'?"tourné vers le nombre, la borne est incluse":"tourné vers l'extérieur, la borne est exclue"}.`:(c<a||c>b)?`${m(c)} est en dehors des bornes ${m(a)} et ${m(b)}.`:`${m(c)} est strictement entre ${m(a)} et ${m(b)}.`;
  return{q:`Le nombre <b class="m">${m(c)}</b> appartient-il à l'intervalle <b class="m">${P(l+a+';'+b+r)}</b> ?`,t:'choice',a:[inI?'Oui':'Non'],keys:['Oui','Non'],sol:e,skill:'Intervalles'}},
 absEq(k){const a=k==='boss'?-R(1,8):RN(-8,8),r=R(1,7);return{q:`Résous l'équation <b class="m">${absTxt(a)} = ${r}</b>.`,t:'set',a:`{${a-r};${a+r}}`,hint:KS_SET,traps:[{a:`{${-a-r};${-a+r}}`,msg:'Mauvais centre : '+absNote(a),tag:'Valeur absolue'},{a:`{${a+r}}`,msg:"Il y a deux nombres à la distance "+r+" du centre : un de chaque côté.",tag:'Valeur absolue'}],sol:`${absNote(a)}<br>Les nombres à distance ${r} de ${m(a)} sont ${m(a)} − ${r} = ${m(a-r)} et ${m(a)} + ${r} = ${m(a+r)}.`,skill:'Valeur absolue'}},
 absIn(k){const a=k==='boss'?-R(1,8):RN(-8,8),r=R(1,7),op=pick(['≤','<']);const br=op==='≤'?['[',']']:[']','['];
  return{q:`Résous l'inéquation <b class="m">${absTxt(a)} ${op} ${r}</b> (réponse sous forme d'intervalle).`,t:'set',a:`${br[0]}${a-r};${a+r}${br[1]}`,hint:KS_SET,traps:[{a:`${br[0]}${-a-r};${-a+r}${br[1]}`,msg:'Mauvais centre : '+absNote(a),tag:'Valeur absolue'}],sol:`${absNote(a)}<br>On cherche les x à une distance ${op==='≤'?'inférieure ou égale':'strictement inférieure'} à ${r} de ${m(a)} : entre ${m(a-r)} et ${m(a+r)}, bornes ${op==='≤'?'incluses':'exclues'}.`,skill:'Valeur absolue'}},

const DAY=864e5;
const REF={easy:60,hard:90,boss:120};          // repère de rythme, en secondes par question
let REFMUL=1;const refOf=k=>REF[k||'hard']*REFMUL;const subjMul=s=>s==='francais'?1.6:1;
function median(a){if(!a.length)return null;const s=a.slice().sort((x,y)=>x-y);const h=s.length>>1;return s.length%2?s[h]:(s[h-1]+s[h])/2}
function buildSkillIndex(worlds){

  worlds.forEach(w=>w.levels.forEach(l=>l.gens.forEach(g=>{
    if(seen.has(g))return;seen.add(g);const sk=new Set();
    for(let i=0;i<4;i++){try{const q=g('hard');if(q&&q.skill)sk.add(q.skill)}catch(e){}}
    sk.forEach(s=>{if(!idx.has(s))idx.set(s,[]);idx.get(s).push(g)})})));

/* rows : {skill, ok, tag, time_s, at, kind}  ->  une entrée par compétence */
function analyse(rows,skillSet,now=Date.now()){
  const by=new Map();
  for(const r of rows){
    const key=(!r.ok&&r.tag&&skillSet.has(r.tag))?r.tag:r.skill;
    const t=new Date(r.at).getTime();if(!isFinite(t))continue;
    const w=Math.pow(.5,Math.max(0,(now-t)/DAY)/14);
    let o=by.get(key);if(!o){o={key,n:0,w:0,e:0,rows:[],last:0};by.set(key,o)}
    o.n++;o.w+=w;if(!r.ok)o.e+=w;o.rows.push({ok:r.ok,t,time:+r.time_s||0,kind:r.kind||'hard'});if(t>o.last)o.last=t}
  const out=[];
  by.forEach(o=>{
    o.rows.sort((a,b)=>b.t-a.t);
    let streak=0;const days=new Set();
    for(const r of o.rows){if(!r.ok)break;streak++;days.add(new Date(r.t).toDateString())}
    o.errs=o.rows.filter(r=>!r.ok).length;
    o.rate=(o.e+0.6)/(o.w+4);                      // taux d'erreur récent, lissé
    o.streak=streak;o.mastered=streak>=5&&days.size>=2;
    o.recentErr=o.rows.some(r=>!r.ok&&now-r.t<21*DAY);
    o.weak=!o.mastered&&o.w>=1.5&&o.rate>=0.25;
    o.consolidate=!o.weak&&!o.mastered&&o.recentErr&&streak>=2;
    o.stale=now-o.last>7*DAY;
    const rec=o.rows.filter(r=>now-r.t<14*DAY),prev=o.rows.filter(r=>now-r.t>=14*DAY&&now-r.t<28*DAY);
    const er=a=>a.filter(r=>!r.ok).length/a.length;
    o.trend=(rec.length>=3&&prev.length>=3)?(er(rec)-er(prev)<=-.15?'mieux':er(rec)-er(prev)>=.15?'pire':'stable'):'';
    o.medTime=median(o.rows.map(r=>r.time));
    o.ratio=median(o.rows.map(r=>r.time/refOf(r.kind)));
    o.slow=o.n>=4&&o.ratio>1.6;
    o.rushed=o.n>=6&&o.ratio<0.4&&o.errs/o.n>0.3;
    out.push(o)});
  return out}
/* Répartition des 10 questions de l'entraînement du jour */
function planTraining(an,focus,skills,n=10){
  const weak=an.filter(o=>o.weak).sort((a,b)=>b.rate-a.rate).map(o=>o.key).filter(k=>skills.includes(k));
  const f=focus.filter(s=>skills.includes(s));
  const targets=[...new Set([...f.slice(0,2),...weak])].slice(0,3);
  const plan=[];
  if(targets.length)for(let i=0;i<6;i++)plan.push(targets[i%targets.length]);
  const seen=new Set(an.map(o=>o.key));
  const cons=an.filter(o=>o.consolidate||(o.mastered&&o.recentErr)).map(o=>o.key).filter(k=>skills.includes(k)&&!targets.includes(k));
  const rev=an.filter(o=>o.stale&&!o.weak).map(o=>o.key).filter(k=>skills.includes(k)&&!targets.includes(k));
  const fresh=skills.filter(s=>!seen.has(s));
  const take=(arr,k)=>{const a=shuffle(arr);const r=[];for(let i=0;a.length&&i<k;i++)r.push(a[i%a.length]);return r};
  plan.push(...take(cons,2));
  plan.push(...take(rev.length?rev:fresh,2));
  const pool=shuffle([...fresh,...skills]);let i=0;
  while(plan.length<n&&pool.length)plan.push(pool[i++%pool.length]);
  return{plan:plan.slice(0,n),targets}}
function trainQuestions(plan,idx){
  const seen=new Set(),qs=[];
  for(const sk of plan){const gens=idx.get(sk);if(!gens)continue;let q=null;
    for(let t=0;t<10;t++){try{q=pick(gens)('hard')}catch(e){q=null}if(q&&q.skill===sk&&!seen.has(q.q))break;q=null}
    if(q){seen.add(q.q);qs.push(q)}}
  return shuffle(qs)}

 {k:'qcm',lv:'e',s:SK.rep,q:`Pourquoi Éloïse vient-elle dans la grotte ?`,o:[`Pour chercher la fleur d'argent qui guérira sa mère.`,`Pour voler le trésor du géant.`,`Pour se cacher de la pluie.`,`Pour réveiller le géant.`],a:0,sol:`« Je viens chercher la fleur d'argent pour guérir ma mère. »`},
 {k:'qcm',lv:'e',s:SK.rep,q:`À quoi la peau du géant est-elle comparée ?`,o:[`À l'écorce d'un vieux chêne.`,`À un nuage de mousse.`,`À du métal poli.`,`À une pierre précieuse.`],a:0,sol:`« grise et rugueuse comme l'écorce d'un vieux chêne » : le mot « comme » introduit la comparaison.`},
 {k:'qcm',lv:'e',s:SK.per,q:`Comment Éloïse se comporte-t-elle devant le géant ?`,o:[`Elle est courageuse : elle recule d'un pas mais garde la tête haute.`,`Elle s'enfuit en criant.`,`Elle se met en colère.`,`Elle reste indifférente.`],a:0,sol:`« Éloïse recula d'un pas, mais elle garda la tête haute » : elle a peur, mais elle tient bon.`},
 {k:'qcm',lv:'h',s:SK.voc,q:`« Gronda-t-il d'une voix de tonnerre » : comment est la voix du géant ?`,o:[`Très forte et grave`,`Douce et aiguë`,`Hésitante et timide`,`Muette`],a:0,sol:`Le tonnerre est un bruit puissant et grave : la voix du géant est impressionnante.`},
 {k:'qcm',lv:'h',s:SK.inf,q:`Que révèle le rire du géant sur son caractère ?`,o:[`Il est moins terrible qu'il n'en a l'air.`,`Il se moque cruellement d'Éloïse.`,`Il a peur de la fillette.`,`Il est devenu fou.`],a:0,sol:`Après un long silence, il rit puis lui offre la fleur : sa taille fait peur, mais il est bienveillant.`},
 {k:'qcm',lv:'b',s:SK.jus,q:`Quelle phrase du géant montre qu'il accepte d'aider Éloïse ?`,o:[`« Prends-la, petite. »`,`« Qui ose troubler mon sommeil ? »`,`« Les hommes viennent ici pour mon trésor »`,`« Il était si grand que sa tête touchait presque le plafond »`],a:0,sol:`« Prends-la » : il lui donne la fleur. Les autres phrases montrent sa colère, ses critiques des hommes, ou le décrivent.`},
 {k:'qcm',lv:'b',s:SK.tps,q:`Pourquoi le texte emploie-t-il l'imparfait dans « Il était si grand que sa tête touchait presque le plafond » ?`,o:[`Pour décrire le géant.`,`Pour raconter une action rapide.`,`Pour exprimer le futur.`,`Pour donner un ordre.`],a:0,sol:`L'imparfait sert à décrire et à parler de ce qui dure. Le passé simple (« recula », « éclata ») raconte les actions qui s'enchaînent.`}]},

roi:{id:'roi',title:'Le roi déguisé',body:`Le roi Aldric, las des flatteries de la cour, décida un matin de vérifier ce que ses sujets pensaient de lui. Il revêtit les habits rapiécés d'un colporteur, se noircit les joues de suie et quitta le château par la porte des cuisines.
Au marché, il s'approcha d'une vieille marchande de pommes.
— Que dit-on du roi, bonne dame ?
— Du roi ? soupira-t-elle. On dit qu'il vit dans l'or pendant que nous comptons nos sous. Mais ne répétez pas cela : les gardes ont des oreilles partout.
Le roi, vexé, poursuivit son chemin et entendit, de bouche en bouche, les mêmes plaintes. Le soir, de retour au palais, il resta longtemps silencieux. Puis il fit appeler son trésorier.
— Demain, dit-il, vous baisserez les impôts de moitié.
Le trésorier, stupéfait, n'osa pas répondre. Il n'avait jamais vu son maître aussi pensif ni aussi sage.`,qs:[
 {k:'kw',lv:'e',s:SK.rep,q:`Comment s'appelle le roi ?`,g:[['aldric']],ans:`Aldric`,sol:`« Le roi Aldric ».`},
 {k:'qcm',lv:'e',s:SK.rep,q:`Pourquoi le roi se déguise-t-il ?`,o:[`Pour savoir ce que ses sujets pensent de lui.`,`Pour échapper aux gardes.`,`Pour jouer un tour à son trésorier.`,`Pour acheter des pommes.`],a:0,sol:`« décida un matin de vérifier ce que ses sujets pensaient de lui ».`},
 {k:'qcm',lv:'e',s:SK.rep,q:`Par où le roi quitte-t-il le château ?`,o:[`Par la porte des cuisines.`,`Par la grande porte du palais.`,`Par un souterrain secret.`,`Par une fenêtre de la tour.`],a:0,sol:`« quitta le château par la porte des cuisines ».`},
 {k:'qcm',lv:'e',s:SK.rep,q:`Quelle décision le roi prend-il à la fin ?`,o:[`Baisser les impôts de moitié.`,`Punir la marchande de pommes.`,`Quitter son royaume.`,`Doubler les impôts.`],a:0,sol:`« vous baisserez les impôts de moitié ».`},
 {k:'qcm',lv:'h',s:SK.inf,q:`Pourquoi la marchande dit-elle « les gardes ont des oreilles partout » ?`,o:[`Elle a peur d'être punie si on l'entend critiquer le roi.`,`Elle trouve que les gardes sont sourds.`,`Elle veut vendre plus de pommes.`,`Elle ne connaît pas le roi.`],a:0,sol:`Cette expression montre qu'on peut être espionné : elle conseille de ne pas répéter ses critiques.`},
 {k:'qcm',lv:'h',s:SK.fig,q:`« Les gardes ont des oreilles partout » : que fait cette expression ?`,o:[`Elle exagère pour dire que les gardes écoutent tout le monde.`,`Elle décrit des gardes qui ont vraiment de grandes oreilles.`,`Elle compare les gardes à des animaux.`,`Elle pose une question.`],a:0,sol:`C'est une image : les gardes ne sont pas partout, mais on a l'impression qu'ils entendent tout. Cette exagération s'appelle une hyperbole.`},
 {k:'qcm',lv:'b',s:SK.per,q:`Comment le roi change-t-il au cours de l'histoire ?`,o:[`Il comprend que ses sujets souffrent et décide de les aider.`,`Il devient plus cruel.`,`Il se désintéresse de son royaume.`,`Il refuse d'écouter ses sujets.`],a:0,sol:`D'abord « vexé », il reste « longtemps silencieux », puis il agit : le trésorier le trouve « pensif » et « sage ».`},
 {k:'qcm',lv:'b',s:SK.voc,q:`« Las des flatteries de la cour » : que signifie « las » ?`,o:[`Fatigué, dégoûté`,`Heureux`,`Surpris`,`Honteux`],a:0,sol:`Le roi n'aime plus les compliments exagérés (les flatteries) : il en est fatigué. C'est pourquoi il veut connaître la vérité.`}]},

/* ---------- Héros et héroïnes ---------- */
tempete:{id:'tempete',title:'La tempête sur la Pointe',body:`Ce matin-là, le port de Camaret dormait encore sous une brume épaisse. Léna, douze ans, sauta sur le pont du Goéland en serrant contre elle son sac de toile. Son oncle Yvon, un marin à la barbe grise, l'attendait près des filets.
— Tu es sûre de vouloir venir ? demanda-t-il. La mer n'est pas toujours aimable.
— J'en rêve depuis des mois, répondit-elle d'une voix qu'elle voulait ferme.
Vers midi, le vent se leva brusquement. Le ciel, noir comme de l'encre, se déchira d'un éclair, et des vagues hautes comme des maisons se mirent à frapper la coque. Léna, accrochée au bastingage, sentit son cœur cogner dans sa poitrine. Elle avait terriblement peur, mais elle n'osait pas l'avouer.
— Tiens la barre ! cria Yvon. Je vais affaler la voile !
Elle obéit, les bras tremblants. Le bateau pencha, hésita, puis se redressa. Au bout d'une heure interminable, le vent faiblit et un rayon de soleil perça les nuages. Yvon posa sa lourde main sur l'épaule de sa nièce.
— Tu as l'étoffe d'une vraie navigatrice, dit-il simplement.`,qs:[
 {k:'kw',lv:'e',s:SK.rep,q:`Comment s'appelle le bateau ?`,g:[['goeland']],ans:`Le Goéland`,sol:`« Léna, douze ans, sauta sur le pont du Goéland ».`},
 {k:'qcm',lv:'e',s:SK.rep,q:`Quel âge a Léna ?`,o:[`Douze ans`,`Dix ans`,`Onze ans`,`Treize ans`],a:0,sol:`« Léna, douze ans, sauta sur le pont ».`},
 {k:'qcm',lv:'e',s:SK.nar,q:`À quelle personne ce récit est-il écrit ?`,o:[`À la troisième personne : le narrateur n'est pas un personnage.`,`À la première personne : le narrateur est Léna.`,`À la deuxième personne : le narrateur s'adresse au lecteur.`],a:0,sol:`Le narrateur dit « Léna », « elle », « son oncle » : il raconte de l'extérieur. À la première personne, on lirait « je ».`},
 {k:'qcm',lv:'e',s:SK.per,q:`Quel sentiment Léna éprouve-t-elle pendant la tempête ?`,o:[`La peur`,`La colère`,`L'ennui`,`La joie`],a:0,sol:`« Elle avait terriblement peur, mais elle n'osait pas l'avouer. »`},
 {k:'ord',lv:'h',s:SK.chr,q:`Remets ces événements dans l'ordre du récit.`,items:[`Yvon félicite sa nièce.`,`Léna monte à bord du Goéland.`,`Léna prend la barre.`,`Le vent se lève violemment.`],a:'BDCA',sol:`Léna monte à bord (B), le vent se lève (D), elle prend la barre (C), puis Yvon la félicite (A). Ordre : B D C A.`},
 {k:'qcm',lv:'h',s:SK.fig,q:`« Le ciel, noir comme de l'encre » : quelle figure de style est utilisée ?`,o:[`Une comparaison`,`Une métaphore`,`Une personnification`,`Une répétition`],a:0,sol:`Le mot « comme » relie le ciel (noir) à l'encre : c'est une comparaison. Sans « comme », ce serait une métaphore.`},
 {k:'qcm',lv:'b',s:SK.inf,q:`Pourquoi Léna n'ose-t-elle pas avouer sa peur ?`,o:[`Elle veut prouver à son oncle qu'elle est courageuse.`,`Elle a déjà oublié sa peur.`,`Son oncle lui a interdit de parler.`,`Elle n'a plus de voix pour crier.`],a:0,sol:`Elle répondait déjà « d'une voix qu'elle voulait ferme » : elle veut paraître courageuse. Le texte ne le dit pas directement, il faut le déduire.`},
 {k:'qcm',lv:'b',s:SK.voc,q:`Dans « un rayon de soleil perça les nuages », que signifie « perça » ?`,o:[`Traversa`,`Cacha`,`Chauffa`,`Effaça`],a:0,sol:`Le soleil passe à travers les nuages : « perça » veut dire « traversa ». Le contexte (rayon, nuages) le fait comprendre.`}]},

coffre:{id:'coffre',title:'Le coffre du grenier',body:`Les vacances chez ma grand-mère commençaient toujours de la même façon : il pleuvait. Cet été-là, pour me distraire, je grimpai au grenier, une pièce sombre qui sentait la poussière et le vieux bois.
Dans un coin, sous une couverture trouée, j'aperçus un coffre en cuir, cerclé de fer. La serrure était rouillée, mais elle céda au premier coup de tournevis. À l'intérieur, entre une boussole cassée et un chapeau mangé par les mites, je découvris une carte jaunie. Une croix rouge marquait l'emplacement d'un vieux chêne, au fond du jardin.
Mon cœur battait si fort que j'en avais mal aux oreilles. Je dévalai l'escalier, attrapai une pelle et courus sous la pluie. Sous les racines du chêne, ma pelle heurta quelque chose de dur : une petite boîte en métal. Elle contenait une lettre de mon grand-père, écrite quand il avait mon âge : « Si tu lis ces lignes, c'est que tu as le goût de l'aventure. Garde-le toute ta vie. »`,qs:[
 {k:'kw',lv:'e',s:SK.rep,q:`Dans quelle pièce de la maison le narrateur trouve-t-il le coffre ?`,g:[['grenier']],ans:`Le grenier`,sol:`« je grimpai au grenier » puis « j'aperçus un coffre en cuir ».`},
 {k:'qcm',lv:'e',s:SK.nar,q:`Qui raconte l'histoire ?`,o:[`Le garçon qui vit l'aventure (le narrateur est un personnage).`,`Un narrateur extérieur à l'histoire.`,`La grand-mère.`,`Le grand-père.`],a:0,sol:`« je grimpai », « j'aperçus » : le narrateur dit « je » et participe à l'action. C'est un récit à la première personne.`},
 {k:'qcm',lv:'e',s:SK.rep,q:`Que trouve le narrateur à l'intérieur du coffre ?`,o:[`Une boussole cassée, un chapeau abîmé et une carte.`,`Des pièces d'or.`,`Une lettre et une pelle.`,`Un tournevis et une couverture.`],a:0,sol:`« entre une boussole cassée et un chapeau mangé par les mites, je découvris une carte jaunie ».`},
 {k:'qcm',lv:'e',s:SK.rep,q:`Que marque la croix rouge sur la carte ?`,o:[`L'emplacement d'un vieux chêne.`,`La maison de la grand-mère.`,`Le grenier.`,`Une rivière.`],a:0,sol:`« Une croix rouge marquait l'emplacement d'un vieux chêne, au fond du jardin. »`},
 {k:'qcm',lv:'h',s:SK.tps,q:`« Je grimpai au grenier » : à quel temps est le verbe « grimpai » ?`,o:[`Au passé simple`,`À l'imparfait`,`Au présent`,`Au futur`],a:0,sol:`La terminaison « -ai » à la première personne du singulier indique le passé simple, temps des actions de premier plan. À l'imparfait, on aurait « je grimpais ».`},
 {k:'qcm',lv:'h',s:SK.voc,q:`« La serrure était rouillée, mais elle céda au premier coup de tournevis » : que signifie « céda » ?`,o:[`S'ouvrit, ne résista plus`,`Se cassa en deux`,`Disparut`,`Brilla`],a:0,sol:`Le coffre s'ouvre : la serrure « cède », c'est-à-dire qu'elle ne résiste plus.`},
 {k:'qcm',lv:'b',s:SK.inf,q:`Qui a caché le coffre, et quand ?`,o:[`Le grand-père, quand il était enfant, pour celui qui le découvrirait.`,`Le grand-père, la semaine dernière.`,`La grand-mère, pour faire une surprise.`,`Le narrateur lui-même.`],a:0,sol:`La lettre est « écrite quand il avait mon âge » : le grand-père l'a écrite enfant. Le texte ne le dit pas en une phrase : il faut rapprocher les indices.`},
 {k:'qcm',lv:'b',s:SK.per,q:`Que montre la phrase « Mon cœur battait si fort que j'en avais mal aux oreilles » ?`,o:[`Une grande excitation`,`Une maladie`,`De la tristesse`,`De l'ennui`],a:0,sol:`L'exagération (« mal aux oreilles ») traduit une émotion forte : l'excitation de la découverte.`}]},

desert:{id:'desert',title:'La tempête de sable',body:`Depuis trois jours, la caravane avançait dans un désert qui semblait ne jamais finir. Les dunes se succédaient, pareilles à de grosses vagues dorées, et le soleil, impitoyable, écrasait les voyageurs de sa chaleur. Le jeune guide, Amadou, marchait en tête, le visage caché sous un chèche bleu. Il connaissait ces sables comme sa poche, mais ce matin-là, une inquiétude lui serrait la gorge : l'eau commençait à manquer.
Soudain, le vent se mit à hurler. Un nuage roux s'éleva à l'horizon et se précipita vers eux, avalant les dunes les unes après les autres.
— Une tempête de sable ! cria Amadou. Couchez les chameaux et couvrez-vous le visage !
Pendant des heures, le sable fouetta les bâches et siffla aux oreilles des voyageurs, qui se serraient les uns contre les autres. Quand le silence revint enfin, le désert avait changé de visage : une immense dune neuve s'était dressée là où s'étendait la plaine. Amadou, soulagé, scruta le ciel étoilé, puis il sourit : une étoile brillante lui indiquait la route du puits.`,qs:[
 {k:'kw',lv:'e',s:SK.rep,q:`Quel est le prénom du guide ?`,g:[['amadou']],ans:`Amadou`,sol:`« Le jeune guide, Amadou, marchait en tête ».`},
 {k:'qcm',lv:'e',s:SK.rep,q:`Quel problème inquiète Amadou avant la tempête ?`,o:[`Le manque d'eau`,`La fatigue des chameaux`,`La présence de voleurs`,`La nuit qui tombe`],a:0,sol:`« une inquiétude lui serrait la gorge : l'eau commençait à manquer ».`},
 {k:'qcm',lv:'e',s:SK.ide,q:`Quel titre convient le mieux à ce texte ?`,o:[`Dans la tempête de sable`,`Le marché de Tombouctou`,`Le retour à la maison`,`La fête des chameaux`],a:0,sol:`Le texte raconte une caravane surprise par une tempête de sable et guidée par Amadou. Un bon titre résume l'idée principale.`},
 {k:'qcm',lv:'e',s:SK.voc,q:`« Le soleil, impitoyable » : que signifie « impitoyable » ?`,o:[`Qui n'a aucune pitié, très dur`,`Très agréable`,`Très lointain`,`Très brillant`],a:0,sol:`Le préfixe « im- » exprime le contraire : sans pitié. Ici, la chaleur écrase les voyageurs.`},
 {k:'qcm',lv:'h',s:SK.fig,q:`« Les dunes se succédaient, pareilles à de grosses vagues dorées » : quelle figure de style est utilisée ?`,o:[`Une comparaison`,`Une métaphore`,`Une personnification`,`Une énumération`],a:0,sol:`Les dunes sont rapprochées de vagues grâce à l'expression « pareilles à » : c'est une comparaison.`},
 {k:'qcm',lv:'h',s:SK.fig,q:`« Le vent se mit à hurler » : quelle figure de style est utilisée ?`,o:[`Une personnification`,`Une comparaison`,`Une énumération`,`Une répétition`],a:0,sol:`« Hurler » est un verbe qui s'applique aux êtres vivants : le vent est présenté comme un être vivant. C'est une personnification.`},
 {k:'qcm',lv:'b',s:SK.inf,q:`Que signifie la phrase « le désert avait changé de visage » ?`,o:[`Le paysage n'était plus le même après la tempête.`,`Le désert est devenu un visage humain.`,`Amadou a changé de masque.`,`Les voyageurs se sont perdus.`],a:0,sol:`Le texte précise : « une immense dune neuve s'était dressée là où s'étendait la plaine ». « Changer de visage » est une image pour dire que le paysage a changé.`},
 {k:'qcm',lv:'b',s:SK.jus,q:`Quelle phrase prouve qu'Amadou connaît très bien la région ?`,o:[`« Il connaissait ces sables comme sa poche »`,`« Le jeune guide, Amadou, marchait en tête »`,`« le soleil, impitoyable, écrasait les voyageurs »`,`« Couchez les chameaux et couvrez-vous le visage ! »`],a:0,sol:`« comme sa poche » signifie « parfaitement ». C'est la seule phrase qui parle de sa connaissance du désert.`}]},

/* ---------- Mystères et frissons ---------- */
marais:{id:'marais',title:'La bête du marais',body:`Au village de Saint-Aubin, on racontait qu'une bête étrange vivait dans le marais. Les anciens parlaient d'une créature immense, couverte d'écailles vertes, dont les yeux brillaient la nuit comme deux lanternes. Chaque soir, les mères rappelaient leurs enfants avant le coucher du soleil.
Pourtant, Thomas, dix ans, ne croyait pas à ces histoires. Un soir de pleine lune, il s'avança sur le chemin de planches qui traversait la vase. Le brouillard lui mouillait le visage, et les grenouilles se turent d'un seul coup. Quelque chose bougea dans les roseaux. Thomas se figea.
Deux yeux dorés l'observaient. Lentement, une silhouette sortit de l'ombre : c'était un énorme crocodile albinos, échappé d'un cirque depuis des mois, maigre et blessé à la patte. Thomas, au lieu de fuir, sentit sa peur se changer en pitié. Le lendemain, il alerta le vétérinaire, et le « monstre » du marais fut soigné puis envoyé dans un parc animalier.`,qs:[
 {k:'kw',lv:'e',s:SK.rep,q:`Comment s'appelle le village ?`,g:[['saint aubin']],ans:`Saint-Aubin`,sol:`« Au village de Saint-Aubin ».`},
 {k:'qcm',lv:'e',s:SK.rep,q:`Comment les anciens décrivent-ils la bête ?`,o:[`Immense, couverte d'écailles vertes, avec des yeux qui brillent la nuit.`,`Petite et couverte de poils.`,`Invisible et silencieuse.`,`Rouge, avec de grandes ailes.`],a:0,sol:`« une créature immense, couverte d'écailles vertes, dont les yeux brillaient la nuit ».`},
 {k:'qcm',lv:'e',s:SK.rep,q:`Que font les mères chaque soir ?`,o:[`Elles rappellent leurs enfants avant le coucher du soleil.`,`Elles vont chasser la bête.`,`Elles chantent des chansons aux enfants.`,`Elles ferment les portes du village.`],a:0,sol:`« Chaque soir, les mères rappelaient leurs enfants avant le coucher du soleil. »`},
 {k:'ord',lv:'e',s:SK.chr,q:`Remets ces événements dans l'ordre du récit.`,items:[`Thomas alerte le vétérinaire.`,`Une silhouette sort de l'ombre.`,`Thomas s'avance sur le chemin de planches.`,`Les grenouilles se taisent.`],a:'CDBA',sol:`Thomas s'avance (C), les grenouilles se taisent (D), la silhouette sort de l'ombre (B), puis Thomas alerte le vétérinaire (A). Ordre : C D B A.`},
 {k:'qcm',lv:'h',s:SK.chr,q:`Quel passage correspond au dénouement (la fin de l'histoire) ?`,o:[`Le « monstre » est soigné puis envoyé dans un parc animalier.`,`Les anciens racontent des légendes.`,`Thomas s'avance sur le chemin de planches.`,`Les grenouilles se taisent.`],a:0,sol:`Le dénouement résout le problème de départ. Ici, la « bête » est découverte et soignée.`},
 {k:'qcm',lv:'h',s:SK.inf,q:`Pourquoi le mot « monstre » est-il entre guillemets à la fin ?`,o:[`Parce que la créature n'est pas vraiment un monstre : c'est un animal blessé.`,`Parce que c'est une citation d'un livre.`,`Parce que c'est un mot étranger.`,`Parce que Thomas l'a inventé.`],a:0,sol:`Les guillemets montrent que ce mot est celui des villageois : la créature n'est qu'un crocodile maigre et blessé.`},
 {k:'qcm',lv:'b',s:SK.fig,q:`« Ses yeux brillaient la nuit comme deux lanternes » : à quoi sert cette comparaison ?`,o:[`À rendre la créature inquiétante.`,`À faire rire le lecteur.`,`À expliquer un fait scientifique.`,`À décrire la lune.`],a:0,sol:`Deux lumières dans l'obscurité font penser à un regard effrayant : l'image installe la peur.`},
 {k:'qcm',lv:'b',s:SK.per,q:`Comment les sentiments de Thomas évoluent-ils face à la créature ?`,o:[`La peur se change en pitié.`,`La pitié se change en colère.`,`L'ennui se change en joie.`,`La colère se change en peur.`],a:0,sol:`« sentit sa peur se changer en pitié » : Thomas voit un animal blessé et non plus un monstre.`}]},

masques:{id:'masques',title:'Le marchand de masques',body:`Chaque année, à la veille du carnaval, la place de Valmont se remplissait de masques de toutes les couleurs. Ce soir-là, un marchand inconnu, vêtu d'un long manteau, proposait un masque d'argent à la mine étrangement sérieuse.
— Il ne se vend pas, dit-il à Clara, qui s'était arrêtée devant l'étal. Il se prête, pour une nuit seulement.
Intriguée, la jeune fille l'enfila. Aussitôt, sa voix lui parut plus grave, ses gestes plus assurés. Au bal, personne ne la reconnut. Elle osa alors dire à son voisin, le terrible monsieur Garnier, ce qu'elle n'aurait jamais dit à visage découvert : que ses cris faisaient peur aux enfants.
Le lendemain, Clara retira le masque, le cœur léger, et le rendit au marchand.
— Il n'a rien de magique, n'est-ce pas ? murmura-t-elle. C'est moi qui ai trouvé le courage.
Le marchand haussa les épaules et se perdit dans la foule.`,qs:[
 {k:'kw',lv:'e',s:SK.rep,q:`Quel est le prénom de la jeune fille ?`,g:[['clara']],ans:`Clara`,sol:`« dit-il à Clara, qui s'était arrêtée devant l'étal ».`},
 {k:'qcm',lv:'e',s:SK.rep,q:`Où le marchand installe-t-il son étal ?`,o:[`Sur la place de Valmont`,`Dans une école`,`Sur un bateau`,`Dans un château`],a:0,sol:`« la place de Valmont se remplissait de masques ». Un étal est une table où l'on expose ce qu'on vend.`},
 {k:'qcm',lv:'e',s:SK.rep,q:`Que dit le marchand à propos du masque d'argent ?`,o:[`Il ne se vend pas : il se prête pour une nuit seulement.`,`Il est gratuit.`,`Il porte malheur.`,`Il est très ancien.`],a:0,sol:`« Il ne se vend pas [...]. Il se prête, pour une nuit seulement. »`},

loup:{id:'loup',title:'La nuit du loup',body:`Je n'ai jamais cru aux loups-garous, jusqu'à cette nuit d'hiver où la neige étouffait les bruits du village. Je rentrais de chez mon ami Gaspard, une lampe-torche à la main, quand un hurlement déchira le silence. Je m'arrêtai net. Derrière le muret du cimetière, une ombre immense se dressait, silhouette à demi humaine, à demi animale.

/* ----- Fabrique de questions à partir des données ----- */
function frGen(t,d){
  const f=function(){
    const base={skill:d.s,text:{id:t.id,title:t.title,body:t.body},sol:d.sol};
    if(d.k==='qcm'){const right=d.o[d.a];return Object.assign(base,{q:d.q,t:'choice',a:[right],keys:shuffle(d.o),long:true,show:esc(right)})}
    if(d.k==='kw')return Object.assign(base,{q:d.q,t:'kw',groups:d.g,native:true,show:esc(d.ans),hint:'Réponds en quelques mots'});
    return Object.assign(base,{q:d.q+'<div class="items">'+d.items.map((x,i)=>`<p class="item"><b>${'ABCDEF'[i]}</b><span>${esc(x)}</span></p>`).join('')+'</div>',t:'ord',a:d.a,native:true,show:esc(d.a.split('').join(' ')),hint:"Écris les lettres dans l'ordre, par exemple : B D A C"})};
  f.lv=d.lv;return f}
function frWorld(id,name,chap,color,glyph,keys,names){
  const gens=keys.map(k=>FR_TEXTS[k].qs.map(d=>frGen(FR_TEXTS[k],d)));
  const all=gens.flat(),hs=all.filter(g=>g.lv==='h'),bs=all.filter(g=>g.lv==='b'),hb=hs.concat(bs);
  const mk=l=>l.map(g=>g());
  return{id,name,chap,color,glyph,levels:[
    {name:names[0],kind:'easy',gens:gens[0],build:()=>mk(gens[0])},
    {name:names[1],kind:'easy',gens:gens[1],build:()=>mk(gens[1])},
    {name:names[2],kind:'hard',gens:gens[2],build:()=>shuffle(mk(gens[2]))},
    {name:names[3],kind:'hard',gens:hb,build:()=>shuffle(mk(shuffle(hb).slice(0,8)))},
    {name:names[4],kind:'boss',gens:hb,build:()=>shuffle(mk(shuffle(bs).concat(shuffle(hs)).slice(0,10)))}]}}

/* ----- Synchronisation vers Supabase ----- */
let flushing=false,apiOK=null;
async function hasApi2(){
  if(apiOK)return true;
  try{const v=await sb('/rest/v1/rpc/mq_api_version',{method:'POST',body:{},timeout:5000});apiOK=(+v>=2)}catch(e){if(e.net)throw e;apiOK=false}
  return apiOK}
async function flush(){
  if(flushing||!ST.profile)return;const d=PD();if(!d.queue.length)return;flushing=true;
  try{
    let i=0;
    while(i<d.queue.length){
      const it=d.queue[i];
      if(it.hist&&!(await hasApi2())){i++;continue}       // l'historique attend la mise à jour de la base
      const {at,hist,...payload}=it;
      try{await sb('/rest/v1/rpc/mq_submit',{method:'POST',body:{p_profile:ST.profile.id,p_code:ST.profile.code,p_attempt:payload}})}
      catch(e){
        if(e.net)throw e;
        if(/code invalide/.test(e.message)){ST.syncErr='code';throw e}
        d.dropped=(d.dropped||0)+1}                        // donnée refusée : on ne bloque pas le reste
      d.queue.splice(i,1);ST.syncErr='';saveST()}}
  catch(e){}
  flushing=false;saveST();
  document.querySelectorAll('[data-sync]').forEach(el=>el.innerHTML=syncText())}
const syncText=()=>{const n=ST.profile?PD().queue.length:0;return ST.syncErr==='code'?'Code joueur refusé : ressaisis-le (Changer de joueur).':n?`${n} partie${n>1?'s':''} à envoyer`:'Résultats envoyés ✓'};
window.addEventListener('online',()=>flush());


/* ----- Historique des parties de l'ancienne version : envoyé avec les vraies dates ----- */
function importOldSessions(){
  if(!ST.profile||ST.profile.niveau!=='2nde')return;const d=PD();if(d.histDone)return;
  try{const old=JSON.parse(localStorage.getItem('mathsquest.v1'));
    if(old&&Array.isArray(old.sessions))old.sessions.forEach(x=>{
      const w=WORLDS[x.w],lv=w&&w.levels[x.l];if(!lv||!x.d||isNaN(new Date(x.d)))return;
      const r=String(x.r||'');let m,score,errors;
      if(m=r.match(/^(\d+)\/10$/)){score=+m[1];errors=10-score}
      else if(m=r.match(/vaincu, (\d+) erreur/)){errors=+m[1];score=10-errors}
      else if(m=r.match(/question (\d+)/)){score=Math.max(0,+m[1]-3);errors=3}
      else return;
      d.queue.push({at:x.d,hist:true,subject:'maths',world:w.id,level:'l'+(x.l+1),kind:lv.kind,score,errors,stars:x.st||0,duration_s:0,answers:[],played_at:x.d})})}
  catch(e){}
  d.histDone=true;saveST()}

async function train(){
  const btn=document.querySelector('.train');if(btn){btn.disabled=true;btn.classList.add('busy')}
  const idx=getIdx(),skills=[...idx.keys()];
  const pend=()=>PD().queue.flatMap(it=>(it.answers||[]).map(a=>({skill:a.skill,ok:a.ok,tag:a.tag,time_s:a.time_s,at:it.at,kind:it.kind})));
  try{const srv=await sb('/rest/v1/rpc/mq_my_stats',{method:'POST',body:{p_profile:ST.profile.id,p_code:ST.profile.code,p_subject:ST.subject},timeout:4000});
    PD().stats=pend().concat(srv.map(r=>({skill:r.skill,ok:r.ok,tag:r.error_tag||'',time_s:+r.time_s,at:r.played_at,kind:'hard'}))).slice(0,400);saveST()}catch(e){}
  let focus=[];
  try{const f=await sb('/rest/v1/rpc/mq_my_focus',{method:'POST',body:{p_profile:ST.profile.id,p_code:ST.profile.code},timeout:3000});focus=f.filter(x=>x.subject===ST.subject).map(x=>x.skill)}catch(e){}
  const an=analyse(localRows(),new Set(skills));
  const {plan}=planTraining(an,focus,skills);
  let qs=trainQuestions(plan,idx);

function hintFor(q){return{expr:q.form==='fact'?'Forme factorisée attendue':q.form==='dev'?'Forme développée et réduite':'',frac:'Fraction irréductible, ex. 7/12',set:KS_SET,list:'Sépare par « ; »'}[q.t]||''}
function kb(){const rows=['7','8','9','(',')','BS','4','5','6','×','/','x','1','2','3','+','−','²','0',',',';','^','√','ℝ','[',']','{','}','∞','∪'];
  return `<div class="kb">${rows.map(k=>`<button class="key ${k==='BS'?'alt':''}" data-act="key" data-k="${k}" aria-label="${k==='BS'?'Effacer':k}">${k==='BS'?'⌫':k}</button>`).join('')}<button class="key alt" data-act="key" data-k="L" aria-label="Curseur à gauche">◀</button><button class="key alt" data-act="key" data-k="R" aria-label="Curseur à droite">▶</button><button class="key alt" data-act="key" data-k="∅">∅</button><button class="key go" data-act="submit">Valider</button></div>`}
function drawInput(){const el=document.getElementById('ans');if(!el)return;
  el.innerHTML=G.s?`${rawHtml(G.s.slice(0,G.c))}<span class="caret"></span>${rawHtml(G.s.slice(G.c))}`:`<span class="caret"></span><span class="ph">Écris ta réponse avec le clavier</span>`}
function play(){
  const train=G.kind==='train',w=train?{color:'var(--w4)'}:cur()[G.wi],q=G.qs[G.i];
  const dots=G.qs.map((_,i)=>{const r=G.res[i];let c='';if(i===G.i&&!G.fb)c='cur';else if(r)c=immediate()?(r.ok?'ok':'ko'):(G.kind==='boss'?(r.ok?'done':'ko'):'done');return `<i class="${c}"></i>`}).join('');
  const head=`<div class="phead"><button class="back" data-act="quit" aria-label="Quitter">✕</button><div class="ttl"><b>${G.spec.name}</b><div class="dots">${dots}</div></div>${G.kind==='boss'?`<div class="hearts" id="hearts">${[0,1,2].map(i=>heart(i<G.lives)).join('')}</div>`:''}</div>`;
  const prevQ=G.qs[G.i-1],same=q.text&&prevQ&&prevQ.text&&prevQ.text.id===q.text.id&&!G.fb;
  const passage=q.text?`<details class="passage"${same?'':' open'}><summary>${same?'Relire le texte : ':''}${esc(q.text.title)}</summary><div class="ptext">${q.text.body.split('\n').map(l=>`<p>${esc(l)}</p>`).join('')}</div></details>`:'';
  const qcard=`${passage}<div class="qcard"><span class="qnum">Question ${G.i+1} / ${G.qs.length}</span><div class="qtext">${q.q}</div></div>`;
  if(G.fb){const r=G.fb;
    app.innerHTML=`<div class="play" style="--wc:${w.color}">${head}<div class="qzone">${qcard}
     <div class="fb ${r.ok?'ok':'ko'}"><h3>${r.ok?'Bien joué !':'Pas tout à fait'}</h3>${!r.ok&&r.msg?`<p class="errname">Erreur repérée : ${r.msg}</p>`:''}
      <dl class="kv"><dt>Ta réponse</dt><dd>${rawHtml(r.raw)}</dd>${r.ok?'':`<dt>Attendu</dt><dd>${pretty(q)}</dd>`}</dl><div class="sol">${q.sol}</div></div></div>
     <div class="nextbar"><button class="btn world" data-act="next">${G.i+1<G.qs.length?'Question suivante':'Voir mon résultat'}</button></div></div>`;return}
  G.t0=performance.now();G.acc=0;
  const choice=!!q.keys;
  const input=choice?'':q.native?`<input id="nat" class="natin" type="text" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Écris ta réponse ici" value="${esc(G.s)}">${q.hint?`<p class="hint">${q.hint}</p>`:''}`:`<div class="ansbox" id="ans" aria-live="polite"></div>${q.hint||hintFor(q)?`<p class="hint">${q.hint||hintFor(q)}</p>`:''}`;
  const chHtml=choice?`<div class="choices ${q.long?'long':''}">${q.keys.map(k=>`<button class="choice ${k.length>2?'word':''} ${G.sel===k?'sel':''}" data-act="choose" data-v="${esc(k)}">${esc(k)}</button>`).join('')}${q.long?'':'<button class="key go" data-act="submit">Valider</button>'}</div>`:'';
  const pad=choice?(q.long?`<div class="choices"><button class="key go" data-act="submit">Valider</button></div>`:chHtml):q.native?`<div class="choices"><button class="key go" data-act="submit">Valider</button></div>`:kb();
  app.innerHTML=`<div class="play" style="--wc:${w.color}">${head}<div class="qzone">${qcard}${choice&&q.long?chHtml:''}${input}<p class="warn" id="warn">${G.warn}</p></div><div class="kbwrap">${pad}</div></div>`;
  if(!choice&&!q.native)drawInput()}
function key(k){if(k==='BS'){if(G.c>0){G.s=G.s.slice(0,G.c-1)+G.s.slice(G.c);G.c--}}else if(k==='L')G.c=Math.max(0,G.c-1);else if(k==='R')G.c=Math.min(G.s.length,G.c+1);else{G.s=G.s.slice(0,G.c)+k+G.s.slice(G.c);G.c+=k.length}
  if(G.warn){G.warn='';const w=document.getElementById('warn');if(w)w.textContent=''}drawInput()}
function submit(){
  const q=G.qs[G.i];const nat=q.native?document.getElementById('nat'):null;if(nat)G.s=nat.value;const raw=q.keys?(G.sel||''):G.s;const r=check(q,raw);
  if(r.invalid){G.warn=r.invalid;const w=document.getElementById('warn');if(w)w.textContent=r.invalid;return}
  const rec={ok:!!r.ok,raw,msg:r.msg||'',skill:q.skill,tag:r.ok?'':(r.tag||''),time:qTime()};G.res[G.i]=rec;
  if(!r.ok){const d=PD();const tag=r.tag||q.skill;d.errors[tag]=(d.errors[tag]||0)+1;saveST()}
  if(immediate()){G.fb=rec;play();const z=document.querySelector('.qzone');if(z)z.scrollTop=0;return}
  if(G.kind==='boss'&&!r.ok){G.lives--;
    if(G.lives<=0)return finish();
    toast(`Une vie perdue · ${G.lives} restante${G.lives>1?'s':''}`);advance();return}
  if(G.kind==='hard')toast('Réponse notée');
  advance()}
function advance(){G.fb=null;G.sel=null;G.s='';G.c=0;G.warn='';if(G.i+1>=G.qs.length)return finish();G.i++;play()}

function finish(){
  const done=G.res.filter(Boolean),score=done.filter(r=>r.ok).length,errs=done.length-score,alive=G.lives>0;
  const train=G.kind==='train',d=PD();const w=train?null:cur()[G.wi];
  let st=0,prev,id=null;
  if(!train){st=starsFor(G.kind,score,errs,alive);id=kid(G.wi,G.li);prev=starsMap()[id];starsMap()[id]=Math.max(prev||0,st);
    const label=G.kind==='boss'?(alive?`vaincu, ${errs} erreur${errs>1?'s':''}`:`perdu à la question ${G.i+1}`):`${score}/10`;
    if(!bestMap()[id]||st>=(prev||0))bestMap()[id]=label}
  const payload={subject:ST.subject,world:train?'train':w.id,level:train?'daily':'l'+(G.li+1),kind:train?'easy':G.kind,score,errors:errs,stars:st,
    duration_s:Math.max(0,Math.min(36000,Math.round((Date.now()-G.tStart)/1000))),
    answers:done.map(r=>({skill:r.skill,ok:r.ok,tag:r.tag||'',time_s:+r.time.toFixed(1)}))};
  const at=new Date().toISOString();payload.played_at=at;
  d.queue.push(Object.assign({at},payload));
  const nk=payload.kind==='boss'?'boss':payload.kind;
  d.stats=done.slice().reverse().map(r=>({skill:r.skill,ok:r.ok,tag:r.tag||'',time_s:+r.time.toFixed(1),at,kind:train?'hard':nk})).concat(d.stats||[]).slice(0,400);
  d.sessions.push({d:at,t:train?'train':G.wi+'-'+G.li,r:`${score}/${done.length}`,st});d.sessions=d.sessions.slice(-40);
  saveST();flush();
  const title=train?'Entraînement terminé':G.kind==='boss'?(alive?'Boss vaincu !':'Le boss a gagné'):st===3?'Parfait !':st>=1?'Niveau réussi':'Encore un effort';
  const next=(!train&&G.li+1<w.levels.length)?G.li+1:null;
  const verdict=train?"Chaque séance ajuste ce qu'on te propose ensuite.":G.kind==='boss'?(alive?`Tu as terrassé ${G.spec.name}. Toutes les étoiles du monde sont à toi${st<3?' — vise le sans-faute':''}.`:`Trois erreurs : le combat recommence avec de nouveaux exercices.`):st>=1?(next!==null&&!prev?`« ${w.levels[next].name} » est débloqué.`:"Rejoue pour gagner plus d'étoiles."):(ST.subject==='francais'?`Il faut au plus deux erreurs pour débloquer la suite. Relis bien le texte, puis rejoue : les questions changent d'ordre.`:`Il faut 8/10 pour débloquer la suite. Les nombres changent à chaque partie.`);
  const items=G.qs.map((q,i)=>{const r=G.res[i];const cls=!r?'na':r.ok?'ok':'ko';const open=r&&!r.ok&&!immediate()?' open':'';
    return `<details class="it ${cls}"${open}><summary><span class="n">${i+1}.</span><span class="s">${!r?'Non traitée':r.ok?'Juste':'Faux'+(r.msg?' — '+r.msg.replace(/<[^>]+>/g,''):'')}</span></summary><div class="qtext">${q.q}</div><dl class="kv">${r?`<dt>Ta réponse</dt><dd>${rawHtml(r.raw)}</dd>`:''}<dt>Attendu</dt><dd>${pretty(q)}</dd></dl><div class="sol">${q.sol}</div></details>`}).join('');
  const wcol=train?'var(--w4)':w.color,wi=G.wi,li=G.li,kind=G.kind;
  app.innerHTML=`<div class="screen res" style="--wc:${wcol}">
   ${train?'':`<div class="bigstars">${[0,1,2].map(i=>star(i<st)).join('')}</div>`}
   <h2>${title}</h2><p class="score">${kind==='boss'?`${score} juste${score>1?'s':''} · ${errs} erreur${errs>1?'s':''}`:`${score} / ${done.length}`}</p><p class="verdict">${verdict}</p>
   <div class="actions">${train?`<button class="btn world" data-act="train">Un autre entraînement</button><button class="btn ghost" data-act="home">Retour à l'accueil</button>`:
     `${next!==null&&st>=1?`<button class="btn world" data-act="start" data-w="${wi}" data-l="${next}">Niveau suivant</button>`:''}<button class="btn ${st>=1&&next!==null?'ghost':'world'}" data-act="start" data-w="${wi}" data-l="${li}">${kind==='boss'&&!alive?'Retenter le boss':'Rejouer'}</button><button class="btn ghost" data-act="world" data-w="${wi}">Carte du monde</button>`}</div>
   <p class="foot" data-sync>${syncText()}</p>
   <div class="review"><h3>${immediate()?'Récapitulatif':'Ta copie corrigée'}</h3>${items}</div></div>`;
  G=null;scrollTo(0,0)}

function bilanText(){
  const d=PD(),[t,mxs]=totals();const dt=new Date();
  let s=`Bilan de ${ST.profile.prenom} – ${dt.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}\nÉtoiles : ${t} / ${mxs}\n`;
  cur().forEach((w,wi)=>{s+=`\n${w.name}\n`;w.levels.forEach((l,li)=>{const st=starsMap()[kid(wi,li)];s+=`  ${l.name} : ${st==null?(unlocked(wi,li)?'pas encore joué':'verrouillé'):'★'.repeat(st)+'☆'.repeat(3-st)+` (meilleur : ${bestMap()[kid(wi,li)]})`}\n`})});
  const week=d.sessions.filter(x=>Date.now()-new Date(x.d)<7*DAY);s+=`\nParties ces 7 derniers jours : ${week.length}\n`;
  const errs=Object.entries(d.errors||{}).sort((a,b)=>b[1]-a[1]).slice(0,4);if(errs.length){s+='\nErreurs les plus fréquentes :\n';errs.forEach(([k,v])=>s+=`  ${k} : ${v}\n`)}
  return s}
function bilan(){const txt=bilanText();
  app.innerHTML=`<div class="screen bilan"><div class="top"><button class="back" data-act="home" aria-label="Retour">←</button><p class="eyebrow">Bilan</p></div>

   <pre id="btxt">${esc(txt)}</pre><button class="btn" data-act="copy">Copier le bilan</button><p class="copied" id="copied"></p></div>`;scrollTo(0,0)}
function copy(){const txt=bilanText();const done=ok=>{document.getElementById('copied').textContent=ok?'Copié !':'Sélectionne le texte au-dessus et copie-le.'};
  const sel=()=>{const el=document.getElementById('btxt'),r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)};
  try{navigator.clipboard.writeText(txt).then(()=>done(true),()=>{sel();done(false)})}catch(e){sel();done(false)}}

const parentSession=()=>{try{return JSON.parse(localStorage.getItem('mq.parent'))}catch(e){return null}};
const setParent=s=>{try{s?localStorage.setItem('mq.parent',JSON.stringify(s)):localStorage.removeItem('mq.parent')}catch(e){}};
const sessFrom=r=>({access:r.access_token,refresh:r.refresh_token,exp:Date.now()+(r.expires_in||3600)*1000});
async function parentToken(){
  let s=parentSession();if(!s||!s.access)return null;
  if(Date.now()>s.exp-60000){try{s=sessFrom(await sb('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:s.refresh}}));setParent(s)}catch(e){if(!e.net)setParent(null);return null}}
  return s.access}

    catch(er){m.className='warn';m.textContent=er.net?'Pas de connexion.':'E-mail ou mot de passe incorrect.'}});

    const email=document.getElementById('pe').value.trim();if(!email){m.className='warn';m.textContent="Entre d'abord ton e-mail.";return}

    catch(er){m.className='warn';m.textContent=er.net?'Pas de connexion.':"Envoi impossible (compte inconnu ?). Utilise le mot de passe."}});
}
