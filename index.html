/* ----- Tableau de bord ----- */
function findLevel(subject,wid,lid){
  if(wid==='train')return{w:'Entraînement',l:'du jour'};
  const c=CURRICULA[subject]||{};
  for(const n of Object.keys(c)){if(!Array.isArray(c[n]))continue;const w=c[n].find(x=>x.id===wid);if(w){const l=w.levels[+String(lid).slice(1)-1];return{w:w.name,l:l?l.name:lid,world:w,level:l}}}
  return{w:wid,l:lid}}
function lineChart(pts){
  if(!pts.length)return '<p class="small">Pas encore de parties.</p>';
  const W=640,H=230,L=40,R=14,T=14,B=30,t0=pts[0].t,t1=pts[pts.length-1].t,span=Math.max(t1-t0,DAY);
  const X=t=>L+(pts.length===1?(W-L-R)/2:(t-t0)/span*(W-L-R)),Y=p=>T+(1-p)*(H-T-B);
  const grid=[0,.5,1].map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" class="gt">${v*100}%</text>`).join('');
  const ma=pts.map((_,i)=>{const s=pts.slice(Math.max(0,i-4),i+1);return{t:pts[i].t,p:s.reduce((a,x)=>a+x.p,0)/s.length}});
  const line=ma.map((q,i)=>`${i?'L':'M'}${X(q.t).toFixed(1)},${Y(q.p).toFixed(1)}`).join('');
  const dots=pts.map(q=>`<circle cx="${X(q.t).toFixed(1)}" cy="${Y(q.p).toFixed(1)}" r="3.5" class="dt"/>`).join('');
  const f=t=>new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Taux de réussite par partie du ${f(t0)} au ${f(t1)}, moyenne glissante sur 5 parties" class="chart">${grid}<path d="${line}" class="ln"/>${dots}<text x="${L}" y="${H-8}" class="gt">${f(t0)}</text><text x="${W-R}" y="${H-8}" text-anchor="end" class="gt">${f(t1)}</text></svg>`}

function dashHTML(){
  const{p,att,ans,foc}=PS.data,now=Date.now();
  const subjects=[...new Set([...att.map(a=>a.subject),...subjectsFor(p.niveau)])];
  if(!subjects.length)subjects.push('maths');
  if(!subjects.includes(PS.subj))PS.subj=subjects[0];
  const subj=PS.subj;REFMUL=subjMul(subj);
  const A=att.filter(a=>a.subject===subj),am=new Map(A.map(a=>[a.id,a]));
  const rows=ans.filter(r=>am.has(r.attempt_id)).map(r=>{const a=am.get(r.attempt_id);return{skill:r.skill,ok:r.ok,tag:r.error_tag||'',time_s:+r.time_s,at:a.played_at,kind:a.world==='train'?'hard':a.kind}});
  const curW=(CURRICULA[subj]||{})[p.niveau]||[];
  const idx=curW.length?buildSkillIndex(curW):new Map();
  const skillSet=new Set([...idx.keys(),...rows.map(r=>r.skill)]);
  const an=analyse(rows,skillSet,now);
  if(!A.length)return `<p class="card small">${esc(p.prenom)} n'a pas encore joué${subjects.length>1?' cette matière':''}. Le code joueur se tape une fois sur son téléphone, sur l'adresse de l'appli.</p>`;

  /* chiffres clés */
  const w7=A.filter(a=>now-new Date(a.played_at)<7*DAY);
  const r7=rows.filter(r=>now-new Date(r.at)<7*DAY),rp=rows.filter(r=>now-new Date(r.at)>=7*DAY&&now-new Date(r.at)<14*DAY);
  const acc=a=>a.length?a.filter(r=>r.ok).length/a.length:null;
  const a7=acc(r7),ap=acc(rp);
  const delta=(a7!=null&&ap!=null)?Math.round((a7-ap)*100):null;
  const last=new Date(A[0].played_at);
  const kpis=`<div class="kpis">
   <div class="kpi"><span>Parties, 7 jours</span><b>${w7.length}</b></div>
   <div class="kpi"><span>Temps de jeu, 7 jours</span><b>${fmtMin(w7.reduce((s,a)=>s+a.duration_s,0))}</b></div>
   <div class="kpi"><span>Réussite, 7 jours</span><b>${a7==null?'–':Math.round(a7*100)+' %'}</b>${delta==null?'':`<em class="${delta>=0?'up':'down'}">${delta>=0?'+':''}${delta} pts vs semaine précédente</em>`}</div>
   <div class="kpi"><span>Dernière partie</span><b>${last.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})}</b></div></div>`;

  /* évolution */
  const pts=A.slice().reverse().map(a=>({t:new Date(a.played_at).getTime(),p:(a.score+a.errors)?a.score/(a.score+a.errors):0}));

  /* compétences */
  const list=an.filter(o=>o.n>=3).sort((x,y)=>(y.weak-x.weak)||(y.rate-x.rate)).slice(0,10);
  const status=o=>o.weak?'<span class="pill bad">À renforcer</span>':o.mastered?'<span class="pill good">Maîtrisée</span>':o.consolidate?'<span class="pill mid">En progrès</span>':'<span class="pill">Correct</span>';
  const flags=o=>(o.slow?'<span class="pill mid">lent</span>':'')+(o.rushed?'<span class="pill bad">rapide et faux</span>':'');
  const tr=o=>({mieux:'<span class="up">▼ moins d\'erreurs</span>',pire:'<span class="down">▲ plus d\'erreurs</span>',stable:'<span class="small">stable</span>'}[o.trend]||'<span class="small">–</span>');
  const skillsTbl=list.length?`<div class="tw"><table><thead><tr><th>Compétence</th><th>Erreurs</th><th>Tendance</th><th>Temps médian</th><th>Statut</th></tr></thead><tbody>${list.map(o=>`<tr><td>${esc(o.key)}</td><td class="num">${o.errs} / ${o.n}</td><td>${tr(o)}</td><td class="num">${o.medTime==null?'–':fmtMin(o.medTime)}</td><td>${status(o)} ${flags(o)}</td></tr>`).join('')}</tbody></table></div><p class="small">Compétences avec au moins 3 réponses. « À renforcer » : taux d'erreur récent élevé (les réponses récentes comptent davantage). « Maîtrisée » : 5 réussites d'affilée sur au moins 2 jours.</p>`:'<p class="small">Pas encore assez de réponses (au moins 3 par compétence) pour détecter des faiblesses.</p>';

  /* rythme */
  const kinds=[['easy','Niveaux faciles'],['hard','Niveaux difficiles et entraînement'],['boss','Boss']];
  const pace=kinds.map(([k,lab])=>{const rr=rows.filter(r=>r.kind===k&&r.time_s>0);if(rr.length<5)return '';
    const md=median(rr.map(r=>r.time_s)),ratio=md/refOf(k);
    const lbl=ratio>1.5?'<span class="pill mid">plus lent que le repère</span>':ratio<0.5?'<span class="pill mid">très rapide</span>':'<span class="pill good">rythme correct</span>';
    return `<li><span>${lab}</span><b>${Math.round(md)} s</b><small>par question (repère ${Math.round(refOf(k))} s)</small>${lbl}</li>`}).join('');
  const rushed=an.filter(o=>o.rushed).map(o=>esc(o.key)),slow=an.filter(o=>o.slow).map(o=>esc(o.key));
  const paceHTML=`${pace?`<ul class="pace">${pace}</ul>`:'<p class="small">Pas encore assez de réponses chronométrées.</p>'}${rushed.length?`<p class="note">Va vite et se trompe : ${rushed.join(', ')}. Il relit probablement mal.</p>`:''}${slow.length?`<p class="note">Beaucoup plus lent que le repère : ${slow.join(', ')}.</p>`:''}<p class="small">Le chrono est invisible pour l'enfant. Les repères (60, 90 et 120 s par question) sont des ordres de grandeur.</p>`;

  /* erreurs fréquentes */
  const tags=new Map();rows.filter(r=>!r.ok).forEach(r=>{const k=r.tag||r.skill;tags.set(k,(tags.get(k)||0)+1)});
  const top=[...tags.entries()].sort((a,b)=>b[1]-a[1]).slice(0,6),mxv=top.length?top[0][1]:1;
  const tagsHTML=top.length?`<ul class="bars">${top.map(([k,v])=>`<li><span>${esc(k)}</span><i style="width:${Math.max(6,v/mxv*100)}%"></i><b>${v}</b></li>`).join('')}</ul>`:'<p class="small">Aucune erreur enregistrée.</p>';

  /* avancement des mondes */
  const best=new Map();A.filter(a=>a.world!=='train').forEach(a=>{const k=a.world+'|'+a.level;best.set(k,Math.max(best.get(k)||0,a.stars))});
  const worldsHTML=curW.length?`<ul class="wprog">${curW.map(w=>`<li><span>${w.name}</span><span class="wl">${w.levels.map((l,li)=>{const s=best.get(w.id+'|l'+(li+1))||0;return `<i class="s${s} ${l.kind==='boss'?'boss':''}" title="${esc(l.name)} : ${s} étoile(s)"></i>`}).join('')}</span></li>`).join('')}</ul>`:'';

  /* séances */
  const seances=A.slice(0,8).map(a=>{const lv=findLevel(a.subject,a.world,a.level);const d=new Date(a.played_at);
    return `<li><span>${d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})} ${d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</span><span>${esc(lv.w)} · ${esc(lv.l)}</span><b>${a.score}/${a.score+a.errors}</b><small>${fmtMin(a.duration_s)}</small></li>`}).join('');

  /* thème imposé */
  const today=new Date().toISOString().slice(0,10);
  const act=foc.filter(f=>f.subject===subj&&f.until>=today);
  const opts=[...skillSet].sort((a,b)=>a.localeCompare(b,'fr')).map(s=>`<option>${esc(s)}</option>`).join('');
  const focusHTML=`${act.length?`<ul class="flist">${act.map(f=>`<li><span>${esc(f.skill)}</span><small>jusqu'au ${new Date(f.until+'T12:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}</small><button class="linkbtn" data-act="p-focusdel" data-id="${f.id}">Retirer</button></li>`).join('')}</ul>`:'<p class="small">Aucun thème imposé.</p>'}
   <form id="ff" class="form inline"><label for="fs">Compétence</label><select id="fs">${opts}</select><label for="fd">Pendant (jours)</label><input id="fd" type="number" min="1" max="60" value="7"><button class="btn" type="submit">Imposer</button></form>
   <p class="small">Ces compétences passent en tête de l'entraînement du jour.</p>`;

  return `${subjects.length>1?`<div class="tabs">${subjects.map(s=>`<button class="tab ${s===subj?'on':''}" data-act="p-subj" data-s="${s}">${esc((CURRICULA[s]||{}).label||s)}</button>`).join('')}</div>`:''}
   <h2 class="ptitle">${esc(p.prenom)} <small>${esc(p.niveau)}</small></h2>${kpis}
   <div class="pgrid">
    <section class="card span2"><h3>Évolution</h3>${lineChart(pts)}<p class="small">Chaque point est une partie. La ligne est la moyenne des 5 dernières.</p></section>
    <section class="card span2"><h3>Points faibles et forts</h3>${skillsTbl}</section>
    <section class="card"><h3>Rythme</h3>${paceHTML}</section>
    <section class="card"><h3>Erreurs les plus fréquentes</h3>${tagsHTML}</section>
    ${worldsHTML?`<section class="card"><h3>Avancement</h3>${worldsHTML}</section>`:''}
    <section class="card"><h3>Dernières parties</h3><ul class="seances">${seances}</ul></section>
    <section class="card"><h3>Thème imposé</h3>${focusHTML}</section>
    <section class="card"><h3>Données</h3><p class="small">Le plan gratuit n'a pas de sauvegarde automatique.</p><button class="btn ghost" data-act="p-csv">Exporter en CSV</button></section>
   </div>`}

function exportCSV(){
  const{p,att,ans}=PS.data,am=new Map(att.map(a=>[a.id,a]));
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const head=['date','matiere','monde','niveau','type','competence','juste','erreur_type','temps_s'];
  const lines=ans.map(r=>{const a=am.get(r.attempt_id);return a?[a.played_at,a.subject,a.world,a.level,a.kind,r.skill,r.ok?1:0,r.error_tag||'',r.time_s].map(q).join(','):null}).filter(Boolean);
  const blob=new Blob(['﻿'+head.join(',')+'\n'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`maths-quest-${p.prenom}.csv`.toLowerCase();document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

/* ----- Événements ----- */
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='home')home();else if(a==='world')world(+b.dataset.w);else if(a==='start')start(+b.dataset.w,+b.dataset.l);
  else if(a==='train')train();
  else if(a==='quit'){const train=G.kind==='train',wi=G.wi;G=null;train?home():world(wi)}
  else if(a==='key')key(b.dataset.k);
  else if(a==='choose'){G.sel=b.dataset.v;document.querySelectorAll('.choice').forEach(c=>c.classList.toggle('sel',c.dataset.v===G.sel));if(G.warn){G.warn='';document.getElementById('warn').textContent=''}}
  else if(a==='submit')submit();else if(a==='next')advance();else if(a==='bilan')bilan();else if(a==='copy')copy();
  else if(a==='subject'){ST.subject=b.dataset.s;saveST();home()}
  else if(a==='logout'){ST.profile=null;saveST();loginView()}
  else if(a==='p-sel'){PS.sel=b.dataset.id;PS.showAdd=false;PS.newCode=null;renderParent()}
  else if(a==='p-add'){PS.showAdd=!PS.showAdd;PS.newCode=null;renderParent()}
  else if(a==='p-codeok'){PS.newCode=null;renderParent()}
  else if(a==='p-out'){setParent(null);PS={profiles:[],sel:null,subj:null,showAdd:false,newCode:null};parentLogin()}
  else if(a==='p-subj'){PS.subj=b.dataset.s;document.getElementById('pbody').innerHTML=dashHTML()}
  else if(a==='p-csv')exportCSV();
  else if(a==='p-focusdel'){const t=await parentToken();if(!t)return;try{await sb(`/rest/v1/mq_focus?id=eq.${b.dataset.id}`,{method:'DELETE',token:t});PS.data.foc=PS.data.foc.filter(f=>f.id!==b.dataset.id);document.getElementById('pbody').innerHTML=dashHTML()}catch(er){toast('Suppression impossible')}}
});
document.addEventListener('submit',async e=>{
  if(e.target.id!=='ff')return;e.preventDefault();
  const t=await parentToken();if(!t)return;const{p}=PS.data;
  const skill=document.getElementById('fs').value,days=Math.max(1,Math.min(60,+document.getElementById('fd').value||7));
  const until=new Date(Date.now()+days*DAY).toISOString().slice(0,10);
  try{await sb('/rest/v1/mq_focus',{method:'POST',token:t,prefer:'return=representation',body:{profile_id:p.id,subject:PS.subj,skill,until}}).then(r=>{PS.data.foc=r.concat(PS.data.foc)});document.getElementById('pbody').innerHTML=dashHTML();toast('Thème imposé')}
  catch(er){toast('Impossible : '+er.message)}});
document.addEventListener('keydown',e=>{if(!G||e.metaKey||e.ctrlKey)return;
  if(G.fb){if(e.key==='Enter'){e.preventDefault();advance()}return}
  const q=G.qs[G.i];if(e.key==='Enter'){e.preventDefault();submit();return}if(q.keys||q.native)return;
  const map={'*':'×','-':'−',Backspace:'BS',ArrowLeft:'L',ArrowRight:'R'};const k=map[e.key]||e.key;
  if(k.length===1&&/[0-9x+×−\/^()\[\]{};,√²∞∪ℝ∅.]/.test(k)||['BS','L','R'].includes(k)){e.preventDefault();key(k)}});

/* ----- Routage ----- */
function route(){
  const h=location.hash;
  if(h.includes('access_token=')){const q=new URLSearchParams(h.slice(1));
    setParent({access:q.get('access_token'),refresh:q.get('refresh_token'),exp:Date.now()+(+q.get('expires_in')||3600)*1000});
    history.replaceState(null,'',location.pathname+'#parent');return parentHome()}
  if(h==='#parent')return parentRoot();
  app.className='';
  if(ST.profile){importOldSessions();flush();home()}else loginView()}
window.addEventListener('hashchange',route);
route();
}
</script>
</body>
